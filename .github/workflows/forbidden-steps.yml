name: forbidden-steps
on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-24.04 }
permissions: { contents: read }
jobs:
  forbidden:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - name: Ningun workflow aplica cambios a un cluster (NFR-U1-41)
        run: uv run --frozen --project vectra-risk python vectra-risk/platform/tests/forbidden_steps.py .github/workflows .github/actions
      - name: Ningun Dockerfile usa latest (US-606)
        run: uv run --frozen --project vectra-risk python vectra-risk/platform/tests/forbidden_steps.py --dockerfiles vectra-risk
