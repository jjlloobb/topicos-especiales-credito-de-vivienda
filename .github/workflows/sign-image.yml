# Firma una imagen ya publicada, por digest, y comprueba la firma (NFR-U1-26).
# Con llave, no sin llave: el banco no usa Fulcio ni Rekor, y `verify-images` admite por llave publica.
name: sign-image
on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-24.04 }
      image: { type: string, required: true, description: "Imagen por digest: registro/nombre@sha256:..." }
      public-key-path: { type: string, required: true, description: "Llave publica versionada, la misma de verify-images" }
    secrets:
      COSIGN_PRIVATE_KEY: { required: true }
      COSIGN_PASSWORD: { required: true }
permissions: { contents: read }
jobs:
  sign:
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE: ${{ inputs.image }}
      PUBLIC_KEY: ${{ inputs.public-key-path }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Firma
        run: |
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Solo se firma por digest: $IMAGE"; exit 1 ;;
          esac
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE"
      - name: La firma se verifica con la llave publica
        run: cosign verify --insecure-ignore-tlog=true --key "$PUBLIC_KEY" "$IMAGE"
