name: policies
on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-24.04 }
      path: { type: string, default: "", description: "Chart de la unidad, relativo a vectra-risk/. Vacio: las verificaciones de U1" }
      namespace: { type: string, default: vectra-app, description: "Namespace donde se instala el chart de `path`" }
permissions: { contents: read }
jobs:
  policies:
    runs-on: ${{ inputs.runner }}
    defaults: { run: { working-directory: vectra-risk } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - run: uv sync --frozen
      - uses: ./.github/actions/setup-helm
      - run: platform/install-tools.sh
      - name: Verificaciones de U1
        if: inputs.path == ''
        run: make -C platform check
      - name: Los snapshots de rendered/ estan al dia
        if: inputs.path == ''
        run: make -C platform check-rendered
      - name: Chart de la unidad
        if: inputs.path != ''
        env:
          CHART: ${{ inputs.path }}
          NAMESPACE: ${{ inputs.namespace }}
        run: make -C platform check-chart CHART="$CHART" NAMESPACE="$NAMESPACE"
