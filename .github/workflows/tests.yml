name: tests
on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-24.04 }
      path: { type: string, required: true }
permissions: { contents: read }
jobs:
  tests:
    runs-on: ${{ inputs.runner }}
    defaults: { run: { working-directory: vectra-risk } }
    env:
      TEST_PATH: ${{ inputs.path }}
      PBT_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - run: uv sync --frozen
      - uses: ./.github/actions/setup-helm
      - name: Charts y snapshots que leen las pruebas de la plataforma
        if: startsWith(inputs.path, 'platform')
        run: make -C platform charts render
      - name: Pruebas con la semilla de PBT registrada
        run: |
          HYPOTHESIS_PROFILE=ci uv run pytest "$TEST_PATH" --rootdir="$TEST_PATH" --import-mode=importlib -p no:cacheprovider \
            --hypothesis-show-statistics --hypothesis-seed="$PBT_SEED" \
            --junit-xml=test-results/junit.xml -o junit_suite_name="pbt-seed-$PBT_SEED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: test-results, path: vectra-risk/test-results }
