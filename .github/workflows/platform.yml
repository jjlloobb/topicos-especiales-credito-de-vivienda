# CI de U1. Sin credenciales de cluster (NFR-U1-40).
name: platform
on:
  pull_request:
    # `edited`: la nota de rollback se puede llenar sin empujar otro commit.
    # Sin filtro de rutas: un check obligatorio de un workflow que no corre deja el PR esperando para siempre.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # CVEs nuevos sin que nadie abra un PR
permissions: { contents: read }
jobs:
  forbidden:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/forbidden-steps.yml
  policies:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/policies.yml
  evidence:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/evidence.yml
  tests:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/tests.yml
    with:
      path: platform
  # El servidor MCP de solo lectura del loop: sus pruebas (sin cluster) comparan las herramientas registradas con `.mcp.json`, `.claude/settings.json` y los agentes.
  tests-mcp:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/tests.yml
    with:
      path: loop/mcp-solo-lectura
      artifact: test-results-mcp
  # La nota de voz del revisor humano: sin microfono, sin red y sin GitHub (grabador, transcriptor y `gh` son dobles). El transcriptor real no se instala.
  tests-nota-de-voz:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/tests.yml
    with:
      path: loop/nota-de-voz
      artifact: test-results-nota-de-voz
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml
  rollback-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: La nota de rollback es obligatoria (NFR-U1-44)
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: python3 vectra-risk/platform/tests/rollback_note.py
