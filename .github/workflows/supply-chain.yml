# Solo escanea (NFR-U1-26): un PR no necesita mas que contents:read. La firma esta en sign-image.yml.
name: supply-chain
on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-24.04 }
      path: { type: string, default: vectra-risk }
permissions: { contents: read }
jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          version: v0.76.1 # la de omision de la accion (v0.64.1) ya no esta publicada
          scan-type: fs
          scan-ref: ${{ inputs.path }}
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          timeout: 15m # el analisis de manifiestos no termina en los 5 min por omision
          trivyignores: vectra-risk/.trivyignore
          # Casos de prueba, inseguros a proposito.
          skip-dirs: vectra-risk/platform/policies/kyverno/fixtures,vectra-risk/platform/policies/rego/tests
          # KSV-0041, aceptado solo para kind (issue 7): ESO lee todos los Secret. No se instala en staging ni prod.
          # KSV-0109, falso positivo (decision T1): el ConfigMap `realm-drift-realm` lleva el realm de Git, y Trivy toma por secretos
          # las claves `revokeRefreshToken` y `client_credentials.use_refresh_token`. `realm-lint` garantiza que el realm no lleva
          # secretos literales. Solo estos tres archivos (uno por entorno); los CronJobs y las ServiceAccount se siguen escaneando.
          # Mas config-cli-realm.yaml de kind (2026-11-09, decision del usuario, PR 85): el ConfigMap `keycloak-config-cli-realm` del Job de
          # kind, con el mismo realm y la misma decision T1, en su propio archivo; `keycloak.yaml` se escanea entero.
          skip-files: vectra-risk/platform/secrets/eso-rbac-secrets-read-kind.yaml,vectra-risk/identity-edge/jobs/rendered/kind/realm-configmap.yaml,vectra-risk/identity-edge/jobs/rendered/staging/realm-configmap.yaml,vectra-risk/identity-edge/jobs/rendered/prod/realm-configmap.yaml,vectra-risk/identity-edge/keycloak/rendered/kind/config-cli-realm.yaml
          format: table
          output: trivy-report.txt
      - name: Hallazgos de Trivy
        if: always()
        run: cat trivy-report.txt
      # El SBOM y los reportes se generan aunque Trivy encuentre algo: el revisor los necesita justo entonces.
      - uses: anchore/sbom-action@7b36ad622f042cab6f59a75c2ac24ccb256e9b45 # v0.20.4
        if: always()
        with:
          path: ${{ inputs.path }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: supply-chain
          path: |
            trivy-report.txt
            sbom.spdx.json
