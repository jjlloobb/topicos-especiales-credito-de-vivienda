{{- /* Deployment product-metrics (Paso 11; INF-U11-01, 02, 03; NFR-U11-05, 13, 20, 21; F28, F50, F60). 2 replicas fijas, sin HPA (`vectra.io/hpa-exempt`, la
exencion de U1). Solo 8081 (`/metrics`, `/healthz`, `/readyz`): sin 8080, sin Server ni AuthorizationPolicy (los de 8081 los genera U1: `metrics-8081`). */ -}}
{{- $digest := required "image.digest es obligatorio: sin digest no se renderiza" .Values.image.digest -}}
{{- $repository := include "product-metrics.repository" . -}}
{{- $d := .Values.deployment -}}
{{- $id := .Values.identity -}}
{{- $keyPath := printf "%s/private-key" $id.mountPath -}}
{{- $policyData := include "product-metrics.policy" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: product-metrics
    app.kubernetes.io/part-of: product-metrics
    vectra.io/criticality: {{ $d.criticality }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    vectra.io/hpa-exempt: {{ required "deployment.hpaExempt es obligatorio" $d.hpaExempt | quote }}
spec:
  replicas: {{ $d.replicas }}
  progressDeadlineSeconds: {{ $d.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: product-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-metrics
        app.kubernetes.io/part-of: product-metrics
      annotations:
        # Un cambio de parametros reinicia las replicas (BR-U11-09): sha256 del `data` del ConfigMap de parametros (el archivo tal cual).
        checksum/config: {{ $policyData | sha256sum }}
    spec:
      serviceAccountName: product-metrics
      automountServiceAccountToken: false
      priorityClassName: {{ $d.priorityClassName }}
      terminationGracePeriodSeconds: {{ $d.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: product-metrics
      containers:
        - name: product-metrics
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, vectra_product.main]
          ports:
            - { name: metrics, containerPort: {{ $d.metricsPort }} }
          # Exactamente las de `process.md` («Entorno y arranque») que el chart pone. `VECTRA_POLICY_PATH` es opcional y no se pone: el ConfigMap se monta en
          # `vectra_product.params.POLICY_PATH`. Ninguna constante del codigo (ciclo, plazo, reintentos, timeout, pagina, breaker, ventanas) es una variable.
          env:
            - { name: VECTRA_REGISTRY_URL, value: {{ required "peers.registryUrl es obligatorio" .Values.peers.registryUrl | quote }} }
            - { name: VECTRA_CLIENT_ID, value: {{ required "identity.clientId es obligatorio" $id.clientId | quote }} }
            - { name: VECTRA_TOKEN_URL, value: {{ required "keycloak.tokenUrl es obligatorio" .Values.keycloak.tokenUrl | quote }} }
            - { name: VECTRA_CLIENT_KEY_PATH, value: {{ $keyPath | quote }} }
            - { name: VECTRA_CA_BUNDLE, value: {{ printf "%s/ca.crt" (required "keycloak.caMountPath es obligatorio" .Values.keycloak.caMountPath) | quote }} }
          # Sin `startupProbe` larga (INF-U11-01): el arranque no espera a U3; la readiness (`/readyz`) si, hasta 30 min con U3 caido.
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            failureThreshold: 2
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: keycloak-ca, mountPath: {{ .Values.keycloak.caMountPath | quote }}, readOnly: true }
            - { name: client-identity, mountPath: {{ $id.mountPath | quote }}, readOnly: true }
            - { name: product-metrics-policy, mountPath: {{ .Values.policy.mountPath | quote }}, readOnly: true }
          resources:
            {{- toYaml $d.resources | nindent 12 }}
      volumes:
        # 0444: el contenedor corre como 65532 y el archivo del Secret es de root; el volumen es de solo lectura y solo de este pod.
        - name: client-identity
          secret: { secretName: {{ $id.secretName | quote }}, defaultMode: 292 }
        - name: keycloak-ca
          configMap: { name: {{ .Values.keycloak.caConfigMap | quote }}, items: [{ key: ca.crt, path: ca.crt }] }
        # Sin `subPath`: el ConfigMap se monta como directorio y el kubelet lo actualiza.
        - name: product-metrics-policy
          configMap: { name: {{ .Values.policy.configMapName | quote }} }
