{{- /* INF-U11-03: la cuenta de servicio es el `sa` de `platform/network/flows.yaml`; Linkerd identifica al proceso por ella. Sin token montado: el
proceso no habla con la API de Kubernetes. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: product-metrics
    app.kubernetes.io/part-of: product-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
