# Source: valkey/templates/sentinel.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-a
  namespace: vectra-edge
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: sentinel-a
    app.kubernetes.io/part-of: identity-edge
    vectra.io/criticality: high
spec:
  serviceName: sentinel-a
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/instance: sentinel-a
      app.kubernetes.io/part-of: identity-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/instance: sentinel-a
        app.kubernetes.io/part-of: identity-edge
        vectra.io/criticality: high
    spec:
      serviceAccountName: sentinel
      automountServiceAccountToken: false
      priorityClassName: vectra-high
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["zone-a"]
      containers:
        - name: sentinel
          image: "kind-registry:5000/vectra/valkey@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a"
          imagePullPolicy: IfNotPresent
          command: [sh, /scripts/start-sentinel.sh]
          ports:
            - { name: sentinel, containerPort: 26379 }
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: SELF_FQDN, value: "$(POD_NAME).sentinel-a.vectra-edge.svc.cluster.local" }
            - { name: MASTER_NAME, value: "ratelimit" }
            - { name: VALKEY_PORT, value: "6379" }
            - { name: SENTINEL_PORT, value: "26379" }
            - { name: SENTINEL_HOSTS, value: "sentinel-a-0.sentinel-a.vectra-edge.svc.cluster.local sentinel-b-0.sentinel-b.vectra-edge.svc.cluster.local sentinel-b-1.sentinel-b.vectra-edge.svc.cluster.local" }
            - { name: SENTINEL_QUORUM, value: "2" }
            - { name: DEFAULT_PRIMARY, value: "valkey-a-0.valkey-a.vectra-edge.svc.cluster.local" }
            - { name: REDISCLI_AUTH, valueFrom: { secretKeyRef: { name: valkey-acl, key: sentinel-lookup-password } } }
          # T4 y T5: la sonda entra como `ratelimit` de Sentinel (`+ping`) con el `REDISCLI_AUTH` del pod y compara con PONG.
          readinessProbe:
            exec:
              command: [sh, -c, '[ "$(valkey-cli --user ratelimit -p 26379 ping)" = PONG ]']
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -c, '[ "$(valkey-cli --user ratelimit -p 26379 ping)" = PONG ]']
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - { name: config, mountPath: /etc/sentinel, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: acl, mountPath: /etc/sentinel-secret, readOnly: true }
            # Sentinel reescribe su configuracion: la copia de trabajo vive aqui (R3).
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: sentinel-config }
        - name: scripts
          configMap: { name: valkey-scripts }
        - name: acl
          secret:
            secretName: valkey-acl
            defaultMode: 288
            items:
              - { key: sentinel-users.conf, path: sentinel-users.conf }
              - { key: sentinel-auth.conf, path: sentinel-auth.conf }
        - name: data
          emptyDir: {}

