            - { name: VALKEY_PORT, value: "6379" }
            - { name: SENTINEL_PORT, value: "26379" }
            - { name: SENTINEL_HOSTS, value: "sentinel-a-0.sentinel-a.vectra-edge.svc.cluster.local sentinel-b-0.sentinel-b.vectra-edge.svc.cluster.local sentinel-b-1.sentinel-b.vectra-edge.svc.cluster.local" }
            - { name: REPLICA_PRIORITY, value: "100" }
            - { name: INITIAL_PRIMARY, value: "valkey-a-0.valkey-a.vectra-edge.svc.cluster.local" }
            - { name: REDISCLI_AUTH, valueFrom: { secretKeyRef: { name: valkey-acl, key: sentinel-lookup-password } } }
            # T5: la sonda entra como `exporter` (el de menos privilegio con `+ping`); `REDISCLI_AUTH` es la de la consulta al arrancar.
            - { name: VALKEY_PROBE_PASSWORD, valueFrom: { secretKeyRef: { name: valkey-acl, key: exporter-password } } }
          # T4 y T5: detras del proxy de Linkerd un `tcpSocket` lo contesta el proxy y no Valkey, asi que la sonda pregunta y compara con PONG.
          readinessProbe:
            exec:
              command: [sh, -c, '[ "$(REDISCLI_AUTH="$VALKEY_PROBE_PASSWORD" valkey-cli --user exporter -p 6379 ping)" = PONG ]']
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -c, '[ "$(REDISCLI_AUTH="$VALKEY_PROBE_PASSWORD" valkey-cli --user exporter -p 6379 ping)" = PONG ]']
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - { name: config, mountPath: /etc/valkey, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: acl, mountPath: /etc/valkey-secret, readOnly: true }
            - { name: data, mountPath: /data }
        # El exportador entra a Valkey con el usuario `exporter` (R5); el scrape al 9121 es del Paso 10.
        - name: exporter
          image: "kind-registry:5000/vectra/redis-exporter@sha256:19bb5c732f5812d5b60b2e0af3c6d82c5b3e418cd020068d65f588a56df4a118"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            - { name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }
            - { name: REDIS_USER, value: exporter }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: valkey-acl, key: exporter-password } } }
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config
          configMap: { name: valkey-config, items: [{ key: valkey.conf, path: valkey.conf }] }
        - name: scripts
          configMap: { name: valkey-scripts }
        # 288 = 0440: el archivo lo lee el grupo del pod (fsGroup).
        - name: acl
          secret:
            secretName: valkey-acl
            defaultMode: 288
            items:
              - { key: users.acl, path: users.acl }
              - { key: valkey-secret.conf, path: valkey-secret.conf }
        - name: data
          emptyDir: {}

---
# Source: valkey/templates/support.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-acl
  namespace: vectra-edge
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey-acl
    app.kubernetes.io/part-of: identity-edge
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  target:
    name: valkey-acl
    template:
      data:
        # R5: Valkey. Sin `+role` para `sentinel`; con `&__sentinel__:hello` (acl-pubsub-default es resetchannels).
        users.acl: |
          user default off
          user ratelimit on >{{ .ratelimit }} ~* +@read +@write +@connection -@dangerous
          user replication on >{{ .replication }} +psync +replconf +ping
          user sentinel on >{{ .sentinel }} +auth +client|setname +client|kill +config|rewrite +exec +info +multi +ping +publish +script|kill +slaveof +subscribe &__sentinel__:hello
          user exporter on >{{ .exporter }} +info +ping +client|setname +config|get +slowlog|get +slowlog|len +latency|latest +latency|histogram +command|info +commandlog|len
        valkey-secret.conf: |
          masteruser replication
          masterauth {{ .replication }}
        # R5: Sentinel. `ratelimit` es el usuario de `envoy-ratelimit` (radix: SENTINEL MASTER, SLAVES, SENTINELS y SUBSCRIBE switch-master);
        # `sentinel-peer`, el de los Sentinel entre si (`sentinel sentinel-user` y `sentinel sentinel-pass`).
        sentinel-users.conf: |
          user default off
          user ratelimit on >{{ .sentinelRatelimit }} +auth +hello +ping +subscribe +sentinel|master +sentinel|slaves +sentinel|sentinels &switch-master
          user sentinel-peer on >{{ .sentinelPeer }} +auth +ping +publish +client|setname +sentinel|is-master-down-by-addr &__sentinel__:hello
          sentinel sentinel-user sentinel-peer
          sentinel sentinel-pass {{ .sentinelPeer }}
        # Hacia el master y las replicas: el usuario `sentinel` de Valkey.
        sentinel-auth.conf: |
          sentinel auth-user ratelimit sentinel
          sentinel auth-pass ratelimit {{ .sentinel }}
        exporter-password: '{{ .exporter }}'
        # Los nodos y los Sentinel preguntan por la primaria con el usuario `ratelimit` de Sentinel.
        sentinel-lookup-password: '{{ .sentinelRatelimit }}'
  data:
    - { secretKey: ratelimit, remoteRef: { key: edge/valkey, property: ratelimit } }
    - { secretKey: replication, remoteRef: { key: edge/valkey, property: replication } }
    - { secretKey: sentinel, remoteRef: { key: edge/valkey, property: sentinel } }
    - { secretKey: sentinelPeer, remoteRef: { key: edge/valkey, property: sentinel-peer } }
    - { secretKey: exporter, remoteRef: { key: edge/valkey, property: exporter } }
    - { secretKey: sentinelRatelimit, remoteRef: { key: edge/valkey, property: sentinel-ratelimit } }
