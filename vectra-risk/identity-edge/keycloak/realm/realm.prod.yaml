components:
  org.keycloak.storage.UserStorageProvider:
  - name: ldap-banco
    providerId: ldap
    config:
      enabled:
      - 'true'
      priority:
      - '0'
      vendor:
      - $(env:LDAP_VENDOR)
      connectionUrl:
      - ldaps://$(env:LDAP_HOST):636
      useTruststoreSpi:
      - always
      startTls:
      - 'false'
      authType:
      - simple
      bindDn:
      - $(env:LDAP_BIND_DN)
      bindCredential:
      - $(env:LDAP_BIND_CREDENTIAL)
      usersDn:
      - $(env:LDAP_USERS_DN)
      usernameLDAPAttribute:
      - $(env:LDAP_USERNAME_ATTRIBUTE)
      rdnLDAPAttribute:
      - $(env:LDAP_RDN_ATTRIBUTE)
      uuidLDAPAttribute:
      - $(env:LDAP_UUID_ATTRIBUTE)
      userObjectClasses:
      - $(env:LDAP_USER_OBJECT_CLASSES)
      editMode:
      - READ_ONLY
      importEnabled:
      - 'true'
      syncRegistrations:
      - 'false'
      changedSyncPeriod:
      - '900'
      fullSyncPeriod:
      - '-1'
      cachePolicy:
      - NO_CACHE
      validatePasswordPolicy:
      - 'false'
      trustEmail:
      - 'false'
