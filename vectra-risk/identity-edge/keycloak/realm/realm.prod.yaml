      included.custom.audience: decision-registry-service
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: aud-bias-monitoring-service
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.custom.audience: bias-monitoring-service
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: aud-explainability-service
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.custom.audience: explainability-service
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-realm-role-mapper
    config:
      claim.name: roles
      multivalued: 'true'
      jsonType.label: String
      access.token.claim: 'true'
      id.token.claim: 'true'
      userinfo.token.claim: 'true'
  - name: sub
    protocol: openid-connect
    protocolMapper: oidc-sub-mapper
    config:
      access.token.claim: 'true'
      id.token.claim: 'true'
  - name: acr
    protocol: openid-connect
    protocolMapper: oidc-acr-mapper
    config:
      access.token.claim: 'true'
      id.token.claim: 'true'
  - name: auth_time
    protocol: openid-connect
    protocolMapper: oidc-usersessionmodel-note-mapper
    config:
      user.session.note: AUTH_TIME
      claim.name: auth_time
      jsonType.label: long
      access.token.claim: 'true'
      id.token.claim: 'true'
  - name: name-id-token
    protocol: openid-connect
    protocolMapper: oidc-full-name-mapper
    config:
      id.token.claim: 'true'
      access.token.claim: 'false'
      userinfo.token.claim: 'false'
