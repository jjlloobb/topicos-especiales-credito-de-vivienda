users:
- username: break-glass
  enabled: true
  emailVerified: false
  realmRoles: []
  clientRoles:
    realm-management:
    - realm-admin
  requiredActions:
  - CONFIGURE_TOTP
  credentials:
  - type: password
    temporary: false
    value: $(env:BREAK_GLASS_PASSWORD)
- username: service-account-keycloak-config-cli
  enabled: true
  serviceAccountClientId: keycloak-config-cli
  clientRoles:
    realm-management:
    - realm-admin
- username: service-account-keycloak-reader
  enabled: true
  serviceAccountClientId: keycloak-reader
  clientRoles:
    realm-management:
    - view-realm
clients:
- clientId: vectra-console
  name: vectra-console
  enabled: true
  protocol: openid-connect
  publicClient: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccessGrantsEnabled: false
  serviceAccountsEnabled: false
  fullScopeAllowed: false
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: https://vectra.banco.internal/
    use.refresh.tokens: 'true'
  redirectUris:
  - https://vectra.banco.internal/callback
  - https://vectra.banco.internal/stepup-callback
  webOrigins:
  - https://vectra.banco.internal
  defaultClientScopes: []
  optionalClientScopes: []
  protocolMappers:
  - name: aud-console-bff
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.custom.audience: console-bff
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: aud-case-service
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.custom.audience: case-service
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: aud-governance-service
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.custom.audience: governance-service
      access.token.claim: 'true'
      id.token.claim: 'false'
  - name: aud-decision-registry-service
