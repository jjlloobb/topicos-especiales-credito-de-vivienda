# kind: CA interna de U1 (INF-U2-01). El digest es de ejemplo mientras ningun workflow construya la imagen (INF-U2-08).
# 2026-11-21: imagen construida en local desde esta rama con el tema `vectra` verde (PR #241), su aspecto oscuro y el selector de idioma (es, en, pt-BR), y
# publicada en el registro de kind (docs/paso-16-kind.md §3). Digest desplegado en el cluster antes de este cambio, para volver atras:
# sha256:1604d2943e1e26f8085c112912e783e074feafac9eec233e9b4fe298a76dbe8a
image:
  repository: kind-registry:5000/vectra/keycloak
  digest: sha256:807a1e05d51760c377d14387a86343a9e6d241b526ec207cb53977926ad64738
# U02-T23 (excepcion solo en kind a NFR-U2-01, decision del 2026-11-14): minimo 1 replica, para ahorrar 1,0195 GiB (1 GiB + 20 Mi del proxy) y 0,6 CPU (500m + 100m del proxy) pedidos en
# la maquina de la demo.
# U12-T08: y maximo 1 (el HPA queda 1-1). Era el unico HPA de kind que podia crecer sin estar contado: con 4 replicas el pico de la demo D2 pasaba de la
# maquina. La politica (`hpa-min-replicas` y `hpa-max-replicas`, set.rego) solo admite el 1 y el 1 en kind; staging y prod siguen en 2 a 4.
autoscaling:
  minReplicas: 1
  maxReplicas: 1
vectra:
  publicHostname: vectra.localtest.me
  tls:
    issuerRef: { name: vectra-internal-ca, kind: ClusterIssuer }
  # U02-T19 (B-1): la excepcion de INF-U2-05a, solo en kind. La imagen es `adorsys/keycloak-config-cli:6.5.1-26.5.5` (la etiqueta de la linea 26
  # de Keycloak), espejada en kind-registry:5000 con el mismo digest del indice (docs/paso-16-kind.md §3). Las listas salen de realm.kind.yaml:
  # un cliente con `$(env:CLIENT_<ID>_JWKS)` y un usuario con `$(env:SYNTH_<USUARIO>_*)`; una prueba las compara con el realm.
  configCli:
    enabled: true
    image:
      repository: kind-registry:5000/vectra/keycloak-config-cli
      digest: sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    realm: ""
    clients:
      - bias-monitoring-job
      - bias-monitoring-service
      - case-service
      - case-worker
      - channel
      - channel-simulator
      - explainability-service
      - governance-service
      - grafana
      - keycloak-config-cli
      - keycloak-reader
      - model-validation-job
      - product-metrics
      - scoring-service
      - verification-reader
    syntheticUsers:
      - analista-1
      - analista-2
      - ingeniero-1
      - ingeniero-2
      - cro-1
