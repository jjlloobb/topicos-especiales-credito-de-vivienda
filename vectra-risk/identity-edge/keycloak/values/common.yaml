# Values comunes de `keycloakx` 7.4.0 (INF-U2-08), Paso 5 del plan de U2. Los de cada entorno: kind.yaml, staging.yaml y prod.yaml.
# Se renderiza con `make -C identity-edge render-keycloak`. Sin valor por defecto para el digest de la imagen ni para el
# `issuerRef` de `keycloak-tls`: cada entorno los fija y, sin ellos, la plantilla falla.
nameOverride: keycloak
fullnameOverride: keycloak

# Los entornos fijan `vectra.publicHostname`, `vectra.tls.issuerRef` y `image.repository`/`image.digest`.
vectra:
  adminHostname: keycloak-admin.vectra-identity.svc.cluster.local
  tlsHostname: keycloak.vectra-identity.svc
  # U02-T19 (B-1; INF-U2-05a, excepcion solo en kind): `keycloak-config-cli` v6.5.1 como hook PostSync y el administrador de arranque de
  # `master`. Solo kind lo enciende (values/kind.yaml); staging y prod siguen bloqueados y no renderizan nada de esto.
  configCli:
    enabled: false
    # Parametros del Job (solo se usan con `enabled: true`). Los recursos son los de INF-U2-06 y la prioridad la de logical-components.
    backoffLimit: 3
    activeDeadlineSeconds: 900
    availabilityTimeout: 300s
    priorityClassName: vectra-normal
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    # `keytool` solo arma un truststore: minimos.
    truststoreResources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
    # La linea 3 de los realms cita `$(env:NOMBRE)` en un comentario (CANDIDATAS.md): el Job la define para que la sustitucion no falle. Quitar al corregir el realm.
    commentPlaceholder: NOMBRE

image:
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# NFR-U2-01: 2 a 4 replicas por CPU, objetivo del 70 %. Con HPA el StatefulSet no fija `replicas`.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

podDisruptionBudget:
  minAvailable: 1

statefulsetLabels:
  vectra.io/criticality: high

priorityClassName: vectra-high

# INF-U2-06.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# NFR-U2-26: `start --optimized`; el ENTRYPOINT de la imagen es kc.sh (Dockerfile).
args:
  - start
  - --optimized

# INF-U2-05: cluster `keycloak-db` de U1, con la credencial de `pg-role-keycloak` (en vectra-identity, la entrega U1).
# La contrasena sale de `existingSecret`; el usuario, de `extraEnv`. Pool maximo de 20 por pod.
database:
  vendor: postgres
  hostname: keycloak-db-rw.vectra-data.svc
  port: 5432
  database: keycloak
  existingSecret: pg-role-keycloak
  existingSecretKey: password

# NFR-U2-02: `persistent-user-sessions` activa por defecto en 26.8.1; no se toca. `cache-stack` = jdbc-ping.
cache:
  stack: default

# NFR-U2-23: proxy-headers=xforwarded. Sin HTTP: el gateway entra por 8443 (F05).
proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: false

metrics:
  enabled: true
health:
  enabled: true

# El puerto de gestion (9000) sirve la salud por HTTPS: hereda el certificado de 8443. kubelet no verifica el certificado.
http:
  relativePath: /auth
  internalScheme: HTTPS

# Sin acceso a la API de Kubernetes: el descubrimiento es JDBC_PING.
serviceAccount:
  create: true
  automountServiceAccountToken: false

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# 7800 es JGroups (F117).
extraPorts:
  - name: jgroups
    containerPort: 7800
    protocol: TCP

topologySpreadConstraints: |
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}

# La plantilla falla sin digest: el `required` no emite nada.
extraEnv: |
  {{- $_ := required "image.digest es obligatorio (INF-U2-08): sin digest no se renderiza" .Values.image.digest }}
  {{- $hostname := required "vectra.publicHostname es obligatorio (INF-U2-01)" .Values.vectra.publicHostname }}
  - name: KC_HOSTNAME
    value: https://{{ $hostname }}/auth
  - name: KC_HOSTNAME_ADMIN
    value: https://{{ .Values.vectra.adminHostname }}:8443/auth
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: {{ .Values.database.existingSecret }}
        key: username
  - name: KC_DB_URL_PROPERTIES
    value: "?sslmode=verify-full&sslrootcert=/etc/vectra/ca/ca.crt"
  - name: KC_DB_POOL_MAX_SIZE
    value: "20"
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: /etc/x509/https/tls.crt
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: /etc/x509/https/tls.key
  - name: JAVA_OPTS_APPEND
    value: -XX:MaxRAMPercentage=70
  # H11 (BR-U2-16): el listener jboss-logging escribe los eventos de exito (el bloqueo, el login) en info; por defecto, debug.
  - name: KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL
    value: info
  # B10 de P-U2-09: `event-metrics-user-tags` es de ejecucion (`kc.sh build` la ignora), por eso va aqui y no en la imagen.
  # Sin `clientId` la metrica `keycloak_user_events_total` no lleva `client_id` y `BreakGlassLogin` no dispara.
  - name: KC_EVENT_METRICS_USER_TAGS
    value: realm,clientId
  {{- if .Values.vectra.configCli.enabled }}
  # Solo kind (U02-T19, B-1): el administrador de arranque de `master`, del Secret que crea `keycloak-bootstrap-admin` (identity/keycloak-admin).
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-bootstrap-admin
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-bootstrap-admin
        key: password
  {{- end }}

# Con root de solo lectura (require-ro-rootfs), Keycloak escribe en /tmp y en /opt/keycloak/data.
extraVolumes: |
  - name: tls
    secret:
      secretName: keycloak-tls
  - name: internal-ca
    configMap:
      name: vectra-internal-ca
  - name: tmp
    emptyDir: {}
  - name: data
    emptyDir: {}

extraVolumeMounts: |
  - name: tls
    mountPath: /etc/x509/https
    readOnly: true
  - name: internal-ca
    mountPath: /etc/vectra/ca
    readOnly: true
  - name: tmp
    mountPath: /tmp
  - name: data
    mountPath: /opt/keycloak/data

extraManifests:
  # Service `keycloak` de platform/network/flows.yaml: 8443 (F05, F50, F94), 7800 (F117) y 9000 (F60).
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: keycloak
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      type: ClusterIP
      selector:
        {{- include "keycloak.selectorLabels" . | nindent 4 }}
      ports:
        - { name: https, port: 8443, targetPort: https, protocol: TCP }
        - { name: jgroups, port: 7800, targetPort: jgroups, protocol: TCP }
        - { name: http-internal, port: 9000, targetPort: http-internal, protocol: TCP }
  # `hostname-admin` (INF-U2-01): un Service propio, que no esta en el gateway.
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ (splitList "." .Values.vectra.adminHostname) | first }}
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      type: ClusterIP
      selector:
        {{- include "keycloak.selectorLabels" . | nindent 4 }}
      ports:
        - { name: https, port: 8443, targetPort: https, protocol: TCP }
  # INF-U2-05b: 90 dias, se renueva a los 60 (P-U1-03).
  - |
    {{- $issuer := required "vectra.tls.issuerRef es obligatorio (INF-U2-05b): cada entorno fija su issuerRef" .Values.vectra.tls.issuerRef }}
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: keycloak-tls
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretName: keycloak-tls
      duration: 2160h
      renewBefore: 720h
      dnsNames:
        - {{ .Values.vectra.tlsHostname }}
        - {{ .Values.vectra.adminHostname }}
      issuerRef:
        name: {{ required "vectra.tls.issuerRef.name es obligatorio (INF-U2-05b)" $issuer.name }}
        kind: {{ required "vectra.tls.issuerRef.kind es obligatorio (INF-U2-05b)" $issuer.kind }}
  # INF-U2-05b, F05: el gateway verifica a Keycloak con la CA del banco (Secret `identity-ca`).
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: BackendTLSPolicy
    metadata:
      name: keycloak
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      targetRefs:
        - group: ""
          kind: Service
          name: keycloak
          sectionName: https
      validation:
        hostname: {{ .Values.vectra.tlsHostname }}
        caCertificateRefs:
          - group: ""
            kind: Secret
            name: identity-ca
  # Bóveda (INF-U2-01, enmienda Q4): la CA, y las llaves de los clientes de administracion de INF-U2-05a.
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: identity-ca
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target: { name: identity-ca }
      data:
        - { secretKey: ca.crt, remoteRef: { key: identity/ca, property: ca.crt } }
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-config-cli-client
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target: { name: keycloak-config-cli-client }
      data:
        - { secretKey: private-key, remoteRef: { key: identity/clients/keycloak-config-cli, property: private-key } }
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-reader-client
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target: { name: keycloak-reader-client }
      data:
        - { secretKey: private-key, remoteRef: { key: identity/clients/keycloak-reader, property: private-key } }
  # Solo kind (U02-T19, B-1; INF-U2-05a, «Excepción solo en kind»): `keycloak-config-cli` v6.5.1 importa `realm.kind.yaml` como hook PostSync de
  # esta Application, con el administrador de arranque de `master` (contraseña; ningun release admite `private_key_jwt`). Con
  # `vectra.configCli.enabled: false` (staging y prod) esta entrada no emite ningun documento.
  - |
    {{- if .Values.vectra.configCli.enabled }}
    {{- $cli := .Values.vectra.configCli }}
    {{- $_ := required "vectra.configCli.image.digest es obligatorio: la imagen de keycloak-config-cli va fijada por digest" $cli.image.digest }}
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: keycloak-config-cli
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    automountServiceAccountToken: false
    ---
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-bootstrap-admin
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target: { name: keycloak-bootstrap-admin }
      data:
        - { secretKey: username, remoteRef: { key: identity/keycloak-admin, property: username } }
        - { secretKey: password, remoteRef: { key: identity/keycloak-admin, property: password } }
    ---
    # El JWKS entra al YAML del realm por sustitucion de texto: entre comillas JSON (`toJson`) es una cadena; sin ellas, un mapa.
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-realm-clients-jwks
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target:
        name: keycloak-realm-clients-jwks
        template:
          data:
            {{- range $cli.clients }}
            CLIENT_{{ . | replace "-" "_" | upper }}_JWKS: '{{ "{{" }} .{{ . | replace "-" "_" }} | toJson {{ "}}" }}'
            {{- end }}
      data:
        {{- range $cli.clients }}
        - { secretKey: {{ . | replace "-" "_" }}, remoteRef: { key: identity/clients/{{ . }}, property: jwks } }
        {{- end }}
    ---
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: keycloak-realm-synthetic-users
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    spec:
      secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
      target: { name: keycloak-realm-synthetic-users }
      data:
        {{- range $cli.syntheticUsers }}
        {{- $var := . | replace "-" "_" | upper }}
        - { secretKey: SYNTH_{{ $var }}_PASSWORD, remoteRef: { key: identity/synthetic-users, property: SYNTH_{{ $var }}_PASSWORD } }
        - { secretKey: SYNTH_{{ $var }}_TOTP_SEED, remoteRef: { key: identity/synthetic-users, property: SYNTH_{{ $var }}_TOTP_SEED } }
        {{- end }}
    ---
    # El realm de Git, sin tocarlo (`--set-file vectra.configCli.realm=identity-edge/keycloak/realm/realm.kind.yaml`, ver `render-keycloak`).
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: keycloak-config-cli-realm
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
    data:
      realm.kind.yaml: |
        {{- required "vectra.configCli.realm es obligatorio: --set-file vectra.configCli.realm=identity-edge/keycloak/realm/realm.kind.yaml" $cli.realm | nindent 8 }}
    ---
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: keycloak-config-cli
      namespace: {{ include "keycloak.namespace" . }}
      labels:
        {{- include "keycloak.labels" . | nindent 4 }}
        vectra.io/criticality: medium
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: {{ $cli.backoffLimit }}
      activeDeadlineSeconds: {{ $cli.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-config-cli
            app.kubernetes.io/part-of: identity-edge
          annotations:
            config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
        spec:
          serviceAccountName: keycloak-config-cli
          priorityClassName: {{ $cli.priorityClassName }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          # Java solo confia en su truststore: se arma con la CA de `identity-ca` (keytool viene en la imagen).
          initContainers:
            - name: truststore
              image: {{ $cli.image.repository }}@{{ $cli.image.digest }}
              imagePullPolicy: IfNotPresent
              command: [keytool]
              args: [-importcert, -noprompt, -alias, vectra-ca, -file, /etc/vectra/ca/ca.crt, -keystore, /trust/truststore.p12, -storetype, PKCS12, -storepass, changeit]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                {{- toYaml $cli.truststoreResources | nindent 16 }}
              volumeMounts:
                - { name: identity-ca, mountPath: /etc/vectra/ca, readOnly: true }
                - { name: trust, mountPath: /trust }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: keycloak-config-cli
              image: {{ $cli.image.repository }}@{{ $cli.image.digest }}
              imagePullPolicy: IfNotPresent
              env:
                - { name: KEYCLOAK_URL, value: "https://{{ .Values.vectra.adminHostname }}:8443/auth" }
                - { name: KEYCLOAK_SSLVERIFY, value: "true" }
                - name: KEYCLOAK_USER
                  valueFrom: { secretKeyRef: { name: keycloak-bootstrap-admin, key: username } }
                - name: KEYCLOAK_PASSWORD
                  valueFrom: { secretKeyRef: { name: keycloak-bootstrap-admin, key: password } }
                - { name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true" }
                - { name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: {{ $cli.availabilityTimeout | quote }} }
                - { name: IMPORT_FILES_LOCATIONS, value: file:/config/realm.kind.yaml }
                - { name: IMPORT_VARSUBSTITUTION_ENABLED, value: "true" }
                - { name: IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR, value: "true" }
                - { name: PUBLIC_HOSTNAME, value: {{ required "vectra.publicHostname es obligatorio (INF-U2-01)" .Values.vectra.publicHostname | quote }} }
                # La linea 3 del realm cita `$(env:NOMBRE)` en un comentario y la sustitucion lo resuelve igual (candidata en CANDIDATAS.md).
                - { name: {{ $cli.commentPlaceholder }}, value: {{ $cli.commentPlaceholder | quote }} }
                - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=70 -Djavax.net.ssl.trustStore=/trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit" }
              envFrom:
                - secretRef: { name: keycloak-realm-clients-jwks }
                - secretRef: { name: keycloak-realm-synthetic-users }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                {{- toYaml $cli.resources | nindent 16 }}
              volumeMounts:
                - { name: realm, mountPath: /config, readOnly: true }
                - { name: trust, mountPath: /trust, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: identity-ca
              secret: { secretName: identity-ca, defaultMode: 288, items: [{ key: ca.crt, path: ca.crt }] }
            - name: realm
              configMap: { name: keycloak-config-cli-realm }
            - { name: trust, emptyDir: {} }
            - { name: tmp, emptyDir: {} }
    {{- end }}
