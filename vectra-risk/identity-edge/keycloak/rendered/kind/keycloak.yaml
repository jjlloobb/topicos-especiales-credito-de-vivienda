# Source: keycloakx/templates/extra-manifests.yaml
# El realm de Git, sin tocarlo (`--set-file vectra.configCli.realm=identity-edge/keycloak/realm/realm.kind.yaml`, ver `render-keycloak`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config-cli-realm
  namespace: vectra-identity
  labels:
    helm.sh/chart: keycloakx-7.4.0
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.8.1"
    app.kubernetes.io/managed-by: Helm
data:
  realm.kind.yaml: |
        # Realm `vectra` (kind): fuente unica del realm, la aplica keycloak-config-cli (BR-U2-12).
        # Sin secretos: contrasenas, semillas TOTP, llaves publicas y datos del LDAP son referencias
        # `$(env:NOMBRE)` que resuelve keycloak-config-cli desde el Secret que entrega ESO.
        # Validado por identity-edge/tools/realm_lint.py.
        realm: vectra
        displayName: Vectra
        enabled: true
        sslRequired: all
        registrationAllowed: false
        registrationEmailAsUsername: false
        rememberMe: false
        loginWithEmailAllowed: false
        duplicateEmailsAllowed: false
        resetPasswordAllowed: false
        editUsernameAllowed: false
        verifyEmail: false
        attributes:
          acr.loa.map: '{"pwd":1,"mfa":2}'
        accessTokenLifespan: 300
        ssoSessionIdleTimeout: 1800
        ssoSessionMaxLifespan: 36000
        bruteForceProtected: true
        bruteForceStrategy: LINEAR
        failureFactor: 5
        waitIncrementSeconds: 60
        maxFailureWaitSeconds: 900
        maxDeltaTimeSeconds: 43200
        permanentLockout: true
        maxTemporaryLockouts: 15
        revokeRefreshToken: true
        refreshTokenMaxReuse: 0
        passwordPolicy: length(14) and notUsername and notEmail and passwordHistory(5) and hashAlgorithm(argon2)
        eventsEnabled: true
        eventsListeners:
        - jboss-logging
        adminEventsEnabled: true
        adminEventsDetailsEnabled: false
        webAuthnPolicyRpEntityName: Vectra
        webAuthnPolicySignatureAlgorithms:
        - ES256
        - RS256
        browserFlow: vectra-browser
        roles:
          realm:
          - name: analista
          - name: ingeniero_riesgo
          - name: cro
          - name: cumplimiento
          - name: operacion
        defaultDefaultClientScopes: []
        defaultOptionalClientScopes: []
        clientScopes:
        - name: bias:compare
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-bias-monitoring-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: bias-monitoring-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: case:recommend
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-scoring-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: scoring-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: core:read-credit
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-core-banking-mock
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: core-banking-mock
