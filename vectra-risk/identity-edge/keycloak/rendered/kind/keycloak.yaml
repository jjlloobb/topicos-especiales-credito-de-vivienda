            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-governance-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: governance-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: governance:promotion
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers: []
        - name: governance:read-dictionary
