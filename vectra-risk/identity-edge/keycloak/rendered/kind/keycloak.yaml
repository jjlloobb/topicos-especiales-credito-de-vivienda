# El JWKS entra al YAML del realm por sustitucion de texto: entre comillas JSON (`toJson`) es una cadena; sin ellas, un mapa.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-clients-jwks
  namespace: vectra-identity
  labels:
    helm.sh/chart: keycloakx-7.4.0
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.8.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  target:
    name: keycloak-realm-clients-jwks
    template:
      data:
        CLIENT_BIAS_MONITORING_JOB_JWKS: '{{ .bias_monitoring_job | toJson }}'
        CLIENT_BIAS_MONITORING_SERVICE_JWKS: '{{ .bias_monitoring_service | toJson }}'
        CLIENT_CASE_SERVICE_JWKS: '{{ .case_service | toJson }}'
        CLIENT_CASE_WORKER_JWKS: '{{ .case_worker | toJson }}'
        CLIENT_CHANNEL_JWKS: '{{ .channel | toJson }}'
        CLIENT_CHANNEL_SIMULATOR_JWKS: '{{ .channel_simulator | toJson }}'
        CLIENT_EXPLAINABILITY_SERVICE_JWKS: '{{ .explainability_service | toJson }}'
        CLIENT_GOVERNANCE_SERVICE_JWKS: '{{ .governance_service | toJson }}'
        CLIENT_GRAFANA_JWKS: '{{ .grafana | toJson }}'
        CLIENT_KEYCLOAK_CONFIG_CLI_JWKS: '{{ .keycloak_config_cli | toJson }}'
        CLIENT_KEYCLOAK_READER_JWKS: '{{ .keycloak_reader | toJson }}'
        CLIENT_MODEL_VALIDATION_JOB_JWKS: '{{ .model_validation_job | toJson }}'
        CLIENT_PRODUCT_METRICS_JWKS: '{{ .product_metrics | toJson }}'
        CLIENT_SCORING_SERVICE_JWKS: '{{ .scoring_service | toJson }}'
        CLIENT_VERIFICATION_READER_JWKS: '{{ .verification_reader | toJson }}'
  data:
    - { secretKey: bias_monitoring_job, remoteRef: { key: identity/clients/bias-monitoring-job, property: jwks } }
    - { secretKey: bias_monitoring_service, remoteRef: { key: identity/clients/bias-monitoring-service, property: jwks } }
    - { secretKey: case_service, remoteRef: { key: identity/clients/case-service, property: jwks } }
    - { secretKey: case_worker, remoteRef: { key: identity/clients/case-worker, property: jwks } }
    - { secretKey: channel, remoteRef: { key: identity/clients/channel, property: jwks } }
