          - type: password
            temporary: false
            value: $(env:SYNTH_INGENIERO_1_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_INGENIERO_1_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: ingeniero-2
          enabled: true
          emailVerified: false
          realmRoles:
          - ingeniero_riesgo
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_INGENIERO_2_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_INGENIERO_2_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: cro-1
          enabled: true
          emailVerified: false
          realmRoles:
          - cro
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_CRO_1_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_CRO_1_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: cro-2
          enabled: true
          emailVerified: false
          realmRoles:
          - cro
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_CRO_2_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_CRO_2_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: cumplimiento-1
          enabled: true
          emailVerified: false
          realmRoles:
          - cumplimiento
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_CUMPLIMIENTO_1_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_CUMPLIMIENTO_1_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: cumplimiento-2
          enabled: true
          emailVerified: false
          realmRoles:
          - cumplimiento
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_CUMPLIMIENTO_2_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_CUMPLIMIENTO_2_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: operacion-1
          enabled: true
          emailVerified: false
          realmRoles:
          - operacion
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_OPERACION_1_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_OPERACION_1_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: operacion-2
          enabled: true
          emailVerified: false
          realmRoles:
          - operacion
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_OPERACION_2_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_OPERACION_2_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: service-account-keycloak-config-cli
          enabled: true
          serviceAccountClientId: keycloak-config-cli
          clientRoles:
            realm-management:
            - realm-admin
        - username: service-account-keycloak-reader
          enabled: true
          serviceAccountClientId: keycloak-reader
          clientRoles:
            realm-management:
            - view-realm
            - view-clients
            - view-users
        clients:
        - clientId: vectra-console
          name: vectra-console
          enabled: true
          protocol: openid-connect
          publicClient: true
          standardFlowEnabled: true
          implicitFlowEnabled: false
          directAccessGrantsEnabled: false
          serviceAccountsEnabled: false
          fullScopeAllowed: false
          attributes:
            pkce.code.challenge.method: S256
            post.logout.redirect.uris: https://$(env:PUBLIC_HOSTNAME)/
            use.refresh.tokens: 'true'
            default.acr.values: mfa
          redirectUris:
          - https://$(env:PUBLIC_HOSTNAME)/callback
          - https://$(env:PUBLIC_HOSTNAME)/stepup-callback
          webOrigins:
          - https://$(env:PUBLIC_HOSTNAME)
          defaultClientScopes: []
          optionalClientScopes: []
          protocolMappers:
          - name: aud-console-bff
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: console-bff
              access.token.claim: 'true'
              id.token.claim: 'false'
          - name: aud-case-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: case-service
              access.token.claim: 'true'
              id.token.claim: 'false'
          - name: aud-governance-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: governance-service
              access.token.claim: 'true'
              id.token.claim: 'false'
          - name: aud-decision-registry-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: decision-registry-service
              access.token.claim: 'true'
              id.token.claim: 'false'
          - name: aud-bias-monitoring-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: bias-monitoring-service
              access.token.claim: 'true'
              id.token.claim: 'false'
          - name: aud-explainability-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
