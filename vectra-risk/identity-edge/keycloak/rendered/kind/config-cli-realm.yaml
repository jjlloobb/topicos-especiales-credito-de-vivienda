        - name: registry:append:scoring
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-decision-registry-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: decision-registry-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: registry:read:explanation
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-decision-registry-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: decision-registry-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: registry:read:metrics
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-decision-registry-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: decision-registry-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: registry:read:monitoring
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-decision-registry-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: decision-registry-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        - name: scoring:explain
          protocol: openid-connect
          attributes:
            include.in.token.scope: 'true'
            display.on.consent.screen: 'false'
          protocolMappers:
          - name: aud-explainability-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: explainability-service
              access.token.claim: 'true'
              id.token.claim: 'false'
        scopeMappings:
        - clientScope: governance:promotion
          roles:
          - ingeniero_riesgo
        - client: vectra-console
          roles:
          - analista
          - ingeniero_riesgo
          - cro
          - cumplimiento
        - client: promotion-tool
          roles:
          - ingeniero_riesgo
        - client: grafana
          roles:
          - analista
          - ingeniero_riesgo
          - cro
          - cumplimiento
          - operacion
        clientScopeMappings:
          realm-management:
          - client: keycloak-config-cli
            roles:
            - realm-admin
          - client: keycloak-reader
            roles:
            - view-realm
            - view-clients
            - view-users
        requiredActions:
        - alias: CONFIGURE_TOTP
          name: Configure OTP
          providerId: CONFIGURE_TOTP
          enabled: true
          defaultAction: false
          priority: 10
        - alias: webauthn-register
          name: Webauthn Register
          providerId: webauthn-register
          enabled: true
          defaultAction: false
          priority: 20
        - alias: UPDATE_PASSWORD
          name: Update Password
          providerId: UPDATE_PASSWORD
          enabled: true
          defaultAction: false
          priority: 57
        - alias: VERIFY_PROFILE
          name: Verify Profile
          providerId: VERIFY_PROFILE
          enabled: false
          defaultAction: false
          priority: 100
        authenticationFlows:
        - alias: vectra-browser
          description: 'Login del realm vectra: LoA 1 (pwd) y LoA 2 (mfa) por rol'
          providerId: basic-flow
          topLevel: true
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: auth-cookie
            requirement: ALTERNATIVE
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: true
            flowAlias: vectra-browser forms
            requirement: ALTERNATIVE
            priority: 20
        - alias: vectra-browser forms
          description: Niveles de autenticacion del realm vectra
          providerId: basic-flow
          topLevel: false
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: true
            flowAlias: vectra-level-pwd
            requirement: CONDITIONAL
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: true
            flowAlias: vectra-mfa-exempt
            requirement: CONDITIONAL
            priority: 20
          - userSetupAllowed: false
            authenticatorFlow: true
            flowAlias: vectra-mfa
            requirement: CONDITIONAL
            priority: 30
        - alias: vectra-level-pwd
          description: 'Nivel 1 (pwd): usuario y contrasena'
          providerId: basic-flow
          topLevel: false
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-level-of-authentication
            requirement: REQUIRED
            authenticatorConfig: loa-pwd
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: auth-username-password-form
            requirement: REQUIRED
            authenticatorConfig: amr-pwd
            priority: 20
        - alias: vectra-mfa-exempt
          description: 'Sin ningun rol con MFA (BR-U2-03): se queda en el nivel 1 (pwd) y el flujo de nivel 2 no corre. No pide nada: solo deja constancia de que corrio'
          providerId: basic-flow
          topLevel: false
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-ingeniero_riesgo
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-cro
            priority: 20
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-cumplimiento
            priority: 30
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-operacion
            priority: 40
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-break-glass
            priority: 50
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-user-role
            requirement: REQUIRED
            authenticatorConfig: cond-role-none-analista
            priority: 60
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: allow-access-authenticator
            requirement: REQUIRED
            priority: 70
        - alias: vectra-mfa factor
          description: 'Segundo factor: TOTP o WebAuthn'
          providerId: basic-flow
          topLevel: false
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: auth-otp-form
            requirement: ALTERNATIVE
            authenticatorConfig: amr-otp-mfa
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: webauthn-authenticator
            requirement: ALTERNATIVE
            authenticatorConfig: amr-hwk-mfa
            priority: 20
        - alias: vectra-mfa
          description: 'Nivel 2 (mfa) obligatorio para todo usuario con alguno de los roles con MFA (BR-U2-03). Una sola condicion de nivel 2: Keycloak no admite dos con el mismo nivel'
          providerId: basic-flow
          topLevel: false
          builtIn: false
          authenticationExecutions:
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-level-of-authentication
            requirement: REQUIRED
            authenticatorConfig: loa-level-mfa
            priority: 10
          - userSetupAllowed: false
            authenticatorFlow: false
            authenticator: conditional-sub-flow-executed
            requirement: REQUIRED
            authenticatorConfig: mfa-not-exempt
            priority: 20
          - userSetupAllowed: false
            authenticatorFlow: true
            flowAlias: vectra-mfa factor
            requirement: REQUIRED
            priority: 30
        authenticatorConfig:
        - alias: loa-pwd
          config:
            loa-condition-level: '1'
            loa-max-age: '36000'
        - alias: loa-level-mfa
          config:
            loa-condition-level: '2'
            loa-max-age: '36000'
        - alias: amr-pwd
          config:
            default.reference.value: pwd
            default.reference.maxAge: '36000'
        - alias: amr-otp-mfa
          config:
            default.reference.value: otp
            default.reference.maxAge: '36000'
        - alias: amr-hwk-mfa
          config:
            default.reference.value: hwk
            default.reference.maxAge: '36000'
        - alias: mfa-not-exempt
          config:
            flow_to_check: vectra-mfa-exempt
            check_result: not-executed
        - alias: cond-role-none-ingeniero_riesgo
          config:
            condUserRole: ingeniero_riesgo
            negate: 'true'
        - alias: cond-role-none-cro
          config:
            condUserRole: cro
            negate: 'true'
        - alias: cond-role-none-cumplimiento
          config:
            condUserRole: cumplimiento
            negate: 'true'
        - alias: cond-role-none-operacion
          config:
            condUserRole: operacion
            negate: 'true'
        - alias: cond-role-none-break-glass
          config:
            condUserRole: realm-management.realm-admin
            negate: 'true'
        - alias: cond-role-none-analista
          config:
            condUserRole: analista
            negate: 'true'
        users:
        - username: analista-1
          enabled: true
          emailVerified: false
          realmRoles:
          - analista
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_ANALISTA_1_PASSWORD)
          - type: otp
            secretData: '{"value":"$(env:SYNTH_ANALISTA_1_TOTP_SEED)"}'
            credentialData: '{"subType":"totp","digits":6,"period":30,"algorithm":"HmacSHA1","secretEncoding":"BASE32"}'
        - username: analista-2
          enabled: true
          emailVerified: false
          realmRoles:
          - analista
          requiredActions: []
          credentials:
          - type: password
            temporary: false
            value: $(env:SYNTH_ANALISTA_2_PASSWORD)
          - type: otp
