# GatewayHighLatency (p95 cliente - p95 backend > 5 ms, 15m)
- interval: 1m
  input_series:
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="1",pod="envoy-0"}'
    values: '0x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="5",pod="envoy-0"}'
    values: '0x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="10",pod="envoy-0"}'
    values: '0x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="25",pod="envoy-0"}'
    values: '0+100x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="50",pod="envoy-0"}'
    values: '0+100x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",le="+Inf",pod="envoy-0"}'
    values: '0+100x40'
