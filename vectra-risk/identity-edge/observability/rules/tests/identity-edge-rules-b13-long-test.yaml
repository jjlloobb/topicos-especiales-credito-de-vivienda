# B13 (U02-T17): RealmDriftStale y SigningKeyAgeStale cuando el Pushgateway no tiene el grupo. Evaluacion cada hora, como el archivo `long`.
rule_files:
- ../identity-edge-rules.yaml
evaluation_interval: 1h
tests:
# El grupo realm-drift nunca existio (el CronJob nunca empujo); el de signing-key-age esta al dia.
- interval: 1h
  input_series:
  - series: 'push_time_seconds{job="signing-key-age"}'
    values: '0+3600x40'
  alert_rule_test:
  - eval_time: 1h
    alertname: RealmDriftStale
    exp_alerts:
    - exp_labels:
        severity: SEV3
        job: realm-drift
      exp_annotations:
        summary: RealmDriftStale
        runbook_url: identity-edge/runbooks/realm-drift.md
  - eval_time: 30h
    alertname: RealmDriftStale
    exp_alerts:
    - exp_labels:
        severity: SEV3
        job: realm-drift
      exp_annotations:
        summary: RealmDriftStale
        runbook_url: identity-edge/runbooks/realm-drift.md
  - eval_time: 30h
    alertname: SigningKeyAgeStale
    exp_alerts: []
# El grupo signing-key-age nunca existio; el de realm-drift esta al dia.
- interval: 1h
  input_series:
  - series: 'push_time_seconds{job="realm-drift"}'
    values: '0+3600x40'
  alert_rule_test:
  - eval_time: 5h
    alertname: SigningKeyAgeStale
    exp_alerts:
    - exp_labels:
        severity: SEV3
        job: signing-key-age
      exp_annotations:
        summary: SigningKeyAgeStale
        runbook_url: identity-edge/runbooks/signing-key-rotation.md
  - eval_time: 30h
    alertname: RealmDriftStale
    exp_alerts: []
# El Pushgateway pierde el grupo despues de empujar bien durante 10 h (reinicio sin persistencia).
- interval: 1h
  input_series:
  - series: 'push_time_seconds{job="realm-drift"}'
    values: '0+3600x10 _x30'
  - series: 'push_time_seconds{job="signing-key-age"}'
    values: '0+3600x10 _x30'
  alert_rule_test:
  - eval_time: 10h
    alertname: RealmDriftStale
    exp_alerts: []
  - eval_time: 10h
    alertname: SigningKeyAgeStale
    exp_alerts: []
  - eval_time: 12h
    alertname: RealmDriftStale
    exp_alerts:
    - exp_labels:
        severity: SEV3
        job: realm-drift
      exp_annotations:
        summary: RealmDriftStale
        runbook_url: identity-edge/runbooks/realm-drift.md
  - eval_time: 12h
    alertname: SigningKeyAgeStale
    exp_alerts:
    - exp_labels:
        severity: SEV3
        job: signing-key-age
      exp_annotations:
        summary: SigningKeyAgeStale
        runbook_url: identity-edge/runbooks/signing-key-rotation.md
# Los dos grupos presentes y al dia (cada CronJob empuja a su ritmo): ninguna de las dos dispara.
- interval: 1h
  input_series:
  - series: 'push_time_seconds{job="realm-drift"}'
    values: '0+3600x40'
  - series: 'push_time_seconds{job="signing-key-age"}'
    values: '0+3600x40'
  alert_rule_test:
  - eval_time: 1h
    alertname: RealmDriftStale
    exp_alerts: []
  - eval_time: 1h
    alertname: SigningKeyAgeStale
    exp_alerts: []
  - eval_time: 35h
    alertname: RealmDriftStale
    exp_alerts: []
  - eval_time: 35h
    alertname: SigningKeyAgeStale
    exp_alerts: []
