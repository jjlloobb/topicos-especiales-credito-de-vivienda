# RateLimitBackendDown (B13): sin la serie del Deployment envoy-ratelimit; `absent` solo conserva las etiquetas de igualdad
- interval: 1m
  input_series:
  - series: 'kube_statefulset_status_replicas_available{namespace="vectra-edge",statefulset="valkey-a"}'
    values: '1x10'
  - series: 'kube_statefulset_status_replicas_available{namespace="vectra-edge",statefulset="valkey-b"}'
    values: '1x10'
  - series: 'redis_up{job="valkey",pod="valkey-a-0"}'
    values: '1x10'
  alert_rule_test:
  - eval_time: 1m
    alertname: RateLimitBackendDown
    exp_alerts: []
  - eval_time: 2m
    alertname: RateLimitBackendDown
    exp_alerts:
    - exp_labels:
        severity: SEV2
        namespace: envoy-gateway-system
        deployment: envoy-ratelimit
      exp_annotations:
        summary: RateLimitBackendDown
        runbook_url: identity-edge/runbooks/rate-limit-backend-down.md
  - eval_time: 8m
    alertname: RateLimitBackendDown
    exp_alerts:
    - exp_labels:
        severity: SEV2
        namespace: envoy-gateway-system
        deployment: envoy-ratelimit
      exp_annotations:
        summary: RateLimitBackendDown
        runbook_url: identity-edge/runbooks/rate-limit-backend-down.md
# RateLimitBackendDown (B13): sin ninguna serie del StatefulSet de Valkey (el selector `statefulset=~"valkey-.+"` no es de igualdad)
- interval: 1m
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="envoy-gateway-system",deployment="envoy-ratelimit"}'
    values: '1x10'
  - series: 'redis_up{job="valkey",pod="valkey-a-0"}'
    values: '1x10'
  alert_rule_test:
  - eval_time: 1m
    alertname: RateLimitBackendDown
    exp_alerts: []
  - eval_time: 2m
    alertname: RateLimitBackendDown
    exp_alerts:
    - exp_labels:
        severity: SEV2
        namespace: vectra-edge
      exp_annotations:
        summary: RateLimitBackendDown
        runbook_url: identity-edge/runbooks/rate-limit-backend-down.md
  - eval_time: 8m
