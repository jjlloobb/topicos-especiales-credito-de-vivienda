# RateLimitBackendDown (B13): la serie desaparece a mitad (kube-state-metrics deja de exponerla)
- interval: 1m
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="envoy-gateway-system",deployment="envoy-ratelimit"}'
    values: '1x4 _x20'
  - series: 'kube_statefulset_status_replicas_available{namespace="vectra-edge",statefulset="valkey-a"}'
    values: '1x24'
  - series: 'kube_statefulset_status_replicas_available{namespace="vectra-edge",statefulset="valkey-b"}'
    values: '1x24'
  - series: 'redis_up{job="valkey",pod="valkey-a-0"}'
    values: '1x24'
  alert_rule_test:
  - eval_time: 4m
    alertname: RateLimitBackendDown
    exp_alerts: []
  - eval_time: 12m
    alertname: RateLimitBackendDown
    exp_alerts:
    - exp_labels:
        severity: SEV2
        namespace: envoy-gateway-system
        deployment: envoy-ratelimit
      exp_annotations:
        summary: RateLimitBackendDown
        runbook_url: identity-edge/runbooks/rate-limit-backend-down.md
