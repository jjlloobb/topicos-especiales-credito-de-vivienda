# B12-B14 (U02-T17, enmienda del 2026-11-06 de P-U2-09): rama de serie nueva, series ausentes y filtro del api-gateway.
rule_files:
- ../identity-edge-rules.yaml
evaluation_interval: 1m
tests:
# RoleConflict (B12): la primera muestra de una serie que nace con el primer evento, sin `for`
- interval: 1m
  input_series:
  - series: 'vectra_role_conflict_total'
    values: '_x5 1x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 5m
    alertname: RoleConflict
    exp_alerts:
    - exp_labels:
        severity: SEV2
      exp_annotations:
        summary: RoleConflict
        runbook_url: identity-edge/runbooks/role-conflict.md
  - eval_time: 9m
    alertname: RoleConflict
    exp_alerts:
    - exp_labels:
        severity: SEV2
      exp_annotations:
        summary: RoleConflict
        runbook_url: identity-edge/runbooks/role-conflict.md
  - eval_time: 10m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 20m
    alertname: RoleConflict
    exp_alerts: []
# RoleConflict (B12): un fallo corto es un solo incremento sobre una serie que ya existia
- interval: 1m
  input_series:
  - series: 'vectra_role_conflict_total'
    values: '0x5 1x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 6m
    alertname: RoleConflict
    exp_alerts:
    - exp_labels:
        severity: SEV2
      exp_annotations:
        summary: RoleConflict
        runbook_url: identity-edge/runbooks/role-conflict.md
  - eval_time: 40m
    alertname: RoleConflict
    exp_alerts: []
# RoleConflict (B12): un contador quieto en 0 no dispara; uno cuya primera muestra ya vale 7 dispara a 2m (limite aceptado: es indistinguible de una serie nueva) y se apaga a los 6m
- interval: 1m
  input_series:
  - series: 'vectra_role_conflict_total'
    values: '0x30'
  alert_rule_test:
  - eval_time: 2m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 20m
    alertname: RoleConflict
    exp_alerts: []
- interval: 1m
  input_series:
  - series: 'vectra_role_conflict_total'
    values: '7x40'
  alert_rule_test:
  - eval_time: 2m
    alertname: RoleConflict
    exp_alerts:
    - exp_labels:
        severity: SEV2
      exp_annotations:
        summary: RoleConflict
        runbook_url: identity-edge/runbooks/role-conflict.md
  - eval_time: 6m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 20m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 30m
    alertname: RoleConflict
    exp_alerts: []
# RoleConflict (B12): una serie nueva que nace en 0 no dispara hasta su primer evento; el incremento posterior dispara
- interval: 1m
  input_series:
  - series: 'vectra_role_conflict_total'
    values: '_x3 0x4 1x30'
  alert_rule_test:
  - eval_time: 5m
    alertname: RoleConflict
    exp_alerts: []
  - eval_time: 8m
    alertname: RoleConflict
    exp_alerts:
    - exp_labels:
        severity: SEV2
      exp_annotations:
        summary: RoleConflict
        runbook_url: identity-edge/runbooks/role-conflict.md
