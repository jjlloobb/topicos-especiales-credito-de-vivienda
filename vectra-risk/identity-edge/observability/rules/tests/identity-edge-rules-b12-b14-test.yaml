  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",pod="envoy-0",envoy_http_conn_manager_prefix="eg-stats-http",le="5"}'
    values: '0x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",pod="envoy-0",envoy_http_conn_manager_prefix="eg-stats-http",le="10"}'
    values: '0x40'
  - series: 'envoy_http_downstream_rq_time_bucket{job="envoy-data-plane",pod="envoy-0",envoy_http_conn_manager_prefix="eg-stats-http",le="25"}'
    values: '0x40'
