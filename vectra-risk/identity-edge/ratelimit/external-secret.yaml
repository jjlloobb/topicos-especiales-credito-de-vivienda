# U02-T11 (Paso 9, R1 y R5): las credenciales con las que `envoy-ratelimit` entra a Sentinel y a Valkey. El controlador crea el
# Deployment en `envoy-gateway-system` y lee `REDIS_AUTH` y `REDIS_SENTINEL_AUTH` por `secretKeyRef` a este Secret, que ESO materializa
# desde la clave `edge/valkey` de la boveda (propiedades `ratelimit` y `sentinel-ratelimit`). Formato `usuario:contrasena` (`splitAuth`).
# K11 (`platform/secrets/eso-rbac-k11.yaml`) le da a ESO el permiso sobre este namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-ratelimit-valkey
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-ratelimit-valkey
    app.kubernetes.io/part-of: identity-edge
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  target:
    name: envoy-ratelimit-valkey
    template:
      data:
        REDIS_AUTH: "ratelimit:{{ .ratelimit }}"
        REDIS_SENTINEL_AUTH: "ratelimit:{{ .sentinelRatelimit }}"
  data:
    - { secretKey: ratelimit, remoteRef: { key: edge/valkey, property: ratelimit } }
    - { secretKey: sentinelRatelimit, remoteRef: { key: edge/valkey, property: sentinel-ratelimit } }
