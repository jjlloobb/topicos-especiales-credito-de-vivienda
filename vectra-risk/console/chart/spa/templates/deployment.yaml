{{- /* Deployment console-spa (Paso 18; INF-U10-01, 03; NFR-U10-12, 20, 22; F02). 2 replicas fijas, sin HPA (`vectra.io/hpa-exempt`, la exencion de U1). Solo 8080.
nginx corre con el sistema de archivos de solo lectura: `/tmp` es un `emptyDir` (el `pid` y los temporales de `console/spa/nginx.conf`). `config.json` va en un
directorio propio, como volumen completo y sin `subPath` (el kubelet lo actualiza; montarlo sobre la raiz de nginx taparia `index.html`). */ -}}
{{- $digest := required "image.digest es obligatorio: sin digest no se renderiza" .Values.image.digest -}}
{{- $repository := include "console-spa.repository" . -}}
{{- $d := .Values.deployment -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-spa
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: console-spa
    app.kubernetes.io/part-of: console
    vectra.io/criticality: {{ $d.criticality }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    vectra.io/hpa-exempt: {{ required "deployment.hpaExempt es obligatorio" $d.hpaExempt | quote }}
spec:
  replicas: {{ $d.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 100%, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: console-spa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-spa
        app.kubernetes.io/part-of: console
      annotations:
        # Un cambio de `config.json` reinicia las replicas: sha256 del texto del ConfigMap (el kubelet tarda en refrescar el volumen y la SPA lo lee al cargar).
        checksum/config: {{ include "console-spa.config" . | sha256sum }}
    spec:
      serviceAccountName: console-spa
      automountServiceAccountToken: false
      priorityClassName: {{ $d.priorityClassName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $d.runAsUser }}
        runAsGroup: {{ $d.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: console-spa
      containers:
        - name: console-spa
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: {{ $d.port }} }
          # `GET /healthz` es un 200 estatico de nginx (sin tocar el disco).
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: {{ .Values.config.mountPath | quote }}, readOnly: true }
          resources:
            {{- toYaml $d.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: { name: {{ .Values.config.configMapName | quote }} }
