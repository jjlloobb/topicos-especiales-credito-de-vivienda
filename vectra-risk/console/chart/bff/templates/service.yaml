{{- /* Service con 8080 (la API; F03) y 8081 (metricas y sondas; F60). Sin afinidad de sesion: el BFF no tiene estado (BR-U10-02). */ -}}
apiVersion: v1
kind: Service
metadata:
  name: console-bff
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: console-bff
    app.kubernetes.io/part-of: console
spec:
  selector:
    app.kubernetes.io/name: console-bff
  ports:
    - { name: http, port: {{ .Values.deployment.port }}, targetPort: http }
    - { name: metrics, port: {{ .Values.deployment.metricsPort }}, targetPort: metrics }
