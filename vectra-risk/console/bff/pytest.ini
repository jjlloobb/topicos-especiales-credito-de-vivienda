[pytest]
# Sin este archivo, `--cov` sin argumento mide la cobertura de U0 (`[tool.coverage.run]` de la raiz).
addopts = --cov-config=console/bff/coveragerc --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Como `bias-monitoring/pytest.ini`: los dobles de esta unidad, el emisor de tokens de U0 (`strategies.auth`) y `tools/role_matrix.py`.
pythonpath = tests/doubles ../../contracts/tests tools
