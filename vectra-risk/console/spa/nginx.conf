# nginx de `console-spa` (INF-U10-02; NFR-U10-44, NFR-U10-45). Corre como el usuario 101 con el sistema de archivos de solo lectura: el `pid` y los
# directorios temporales van en /tmp (el chart pone un `emptyDir` ahi). Escucha en 8080 (F02: el gateway de U2 es el unico cliente).
# Las cabeceras de seguridad (HSTS, CSP, marcos, referrer, COOP, tipos) las pone el gateway de U2 (perfiles `common` y `spa` de `routes.yaml`): aqui ninguna.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    # Los directorios temporales (por omision en /var/cache/nginx, de solo lectura): todos en /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # `.size-limit.mjs` mide el JavaScript inicial con gzip «porque es lo que sirve nginx» (spa.md §9).
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/javascript application/javascript text/css application/json;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        # Las sondas del chart (INF-U10-01): 200 estatico, sin tocar el disco.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # `config.json` lo monta el chart como volumen completo (sin `subPath`) en un directorio propio: montarlo sobre la raiz taparia `index.html`.
        location = /config.json {
            alias /etc/vectra/console-spa/config.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        # El release de la SPA no genera `version.json` mientras `version` este diferido: da 404, y la linea se queda para cuando vuelva.
        location = /version.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # Los archivos con hash en el nombre: nunca cambian. Un archivo que no existe es 404, nunca HTML.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Fallback a `index.html` solo para rutas sin extension (`/`, `/callback`, `/stepup-callback`, `/casos/<id>`): el enrutador de la SPA decide.
        # Sale con `no-store`, igual que `index.html`.
        location ~ ^[^.]*$ {
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        # Todo lo demas tiene extension: el archivo existe o es 404.
        location / {
            try_files $uri =404;
        }
    }
}
