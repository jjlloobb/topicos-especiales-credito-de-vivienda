info:
  title: decision-registry-service
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/dossiers/{case_id}:
    get:
      operationId: get_v1_dossiers_case_id
      parameters:
      - in: path
        name: case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryDossier'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes: []
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: false
      x-vectra-read-only: false
      x-vectra-roles:
      - cro
      - cumplimiento
      x-vectra-scopes: []
  /v1/entries:
    get:
      operationId: get_v1_entries
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RegistryEntry_'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes:
      - registry:read:explanation
      - registry:read:metrics
      - registry:read:monitoring
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: false
      x-vectra-read-only: false
      x-vectra-roles: []
      x-vectra-scopes: []
    post:
      operationId: post_v1_entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryEntryIn'
        required: true
      responses:
        '204':
          description: Sin contenido
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes:
      - registry:append:case
      - registry:append:governance
      - registry:append:scoring
      x-vectra-max-body-bytes: 81920
      x-vectra-mfa: false
      x-vectra-read-only: false
      x-vectra-roles: []
      x-vectra-scopes: []
  /v1/integrity-checks:
    post:
      operationId: post_v1_integrity-checks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityCheckRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityCheckRef'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes: []
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: true
      x-vectra-read-only: false
      x-vectra-roles:
      - cro
      x-vectra-scopes: []
  /v1/integrity-checks/{id}:
    get:
      operationId: get_v1_integrity-checks_id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityCheckStatus'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes: []
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: false
      x-vectra-read-only: false
      x-vectra-roles:
      - cro
      x-vectra-scopes: []
  /v1/monitoring/daily:query:
    post:
      operationId: post_v1_monitoring_daily_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringQuery'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringWindow'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Problem
      x-vectra-any-scopes: []
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: false
      x-vectra-read-only: true
      x-vectra-roles: []
      x-vectra-scopes:
      - registry:read:monitoring
  /v1/monitoring/freezes:
