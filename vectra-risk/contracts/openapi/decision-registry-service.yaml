          description: Problem
      x-vectra-any-scopes: []
      x-vectra-max-body-bytes: 32768
      x-vectra-mfa: false
      x-vectra-read-only: false
      x-vectra-roles: []
      x-vectra-scopes:
      - registry:read:monitoring
