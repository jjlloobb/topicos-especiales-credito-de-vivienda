components:
  schemas:
    Actor:
      additionalProperties: false
      properties:
        acr:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Acr
        auth_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Auth Time
        id:
          title: Id
          type: string
        kind:
          enum:
          - user
          - service
          - system
          title: Kind
          type: string
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          default: null
      required:
      - kind
      - id
      title: Actor
      type: object
    AttributeResult:
      additionalProperties: false
      properties:
        aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Aggregate
        aggregate_ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Aggregate Ci 95
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        bands:
          items:
            $ref: '#/components/schemas/BandResult'
          title: Bands
          type: array
        cells:
          items:
            $ref: '#/components/schemas/CellResult'
          title: Cells
          type: array
        population_difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Population Difference
        population_difference_partial:
          title: Population Difference Partial
          type: boolean
      required:
      - attribute
      - cells
      - bands
      - population_difference_partial
      title: AttributeResult
      type: object
    BandResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Ci 95
        difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Difference
        extreme_pair:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Extreme Pair
        n_band:
          minimum: 0
          title: N Band
          type: integer
      required:
      - band
      - n_band
      title: BandResult
      type: object
    CategoryFeature:
      additionalProperties: false
      properties:
        type:
          const: category
          default: category
          title: Type
          type: string
        value:
          maxLength: 60
          title: Value
          type: string
      required:
      - value
      title: CategoryFeature
      type: object
    CellResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        n:
          minimum: 0
          title: N
          type: integer
        rate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Rate
        status:
          enum:
          - suficiente
          - muestra_insuficiente
          title: Status
          type: string
      required:
      - group
      - band
      - n
      - status
      title: CellResult
      type: object
    CheckpointPayload:
      additionalProperties: false
      properties:
        checkpoint_hash:
          title: Checkpoint Hash
          type: string
        checkpoint_seq:
          title: Checkpoint Seq
          type: integer
        key_fingerprint:
          title: Key Fingerprint
          type: string
        signature:
          title: Signature
          type: string
      required:
      - checkpoint_seq
      - checkpoint_hash
      - signature
      - key_fingerprint
      title: CheckpointPayload
      type: object
    DataSourceEventPayload:
      additionalProperties: false
      properties:
        event:
          enum:
          - propuesta
          - evaluacion_iniciada
          - aprobada
          - rechazada
          title: Event
          type: string
        pre_post_report:
          anyOf:
          - $ref: '#/components/schemas/PrePostReport'
          - type: 'null'
          default: null
        source_id:
          title: Source Id
          type: string
      required:
      - event
      - source_id
      title: DataSourceEventPayload
      type: object
    DayRange:
      additionalProperties: false
      properties:
        from_day:
          format: date
          title: From Day
          type: string
        to_day:
          format: date
          title: To Day
          type: string
      required:
      - from_day
      - to_day
      title: DayRange
      type: object
    DecimalFeature:
      additionalProperties: false
      properties:
        type:
          const: decimal
          default: decimal
          title: Type
          type: string
        value:
          pattern: ^-?\d+(\.\d+)?$
          title: Value
          type: string
      required:
      - value
      title: DecimalFeature
      type: object
    Decision:
      enum:
      - sigue
      - se_aparta
      - resuelve_revision
      title: Decision
      type: string
    DepartureRate:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        rate:
          pattern: ^-?\d+\.\d{4}$
          title: Rate
          type: string
      required:
      - group
      - band
      - rate
      title: DepartureRate
      type: object
    DisparityResult:
      additionalProperties: false
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResult'
          title: Attributes
          type: array
        departure_rates:
          anyOf:
          - items:
              $ref: '#/components/schemas/DepartureRate'
            type: array
          - type: 'null'
          default: null
          title: Departure Rates
        model_aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Model Aggregate
        model_version_id:
          title: Model Version Id
          type: string
        population:
          enum:
          - modelo
          - humana
          title: Population
          type: string
        trigger_attribute:
          anyOf:
          - enum:
            - sexo
            - rango_edad
            - region
            - estrato
            type: string
          - type: 'null'
          default: null
          title: Trigger Attribute
        window_from:
          format: date
          title: Window From
          type: string
        window_to:
          format: date
          title: Window To
          type: string
      required:
      - population
      - model_version_id
      - window_from
      - window_to
      - attributes
      title: DisparityResult
      type: object
    DossierEntry:
      additionalProperties: false
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        canonical:
          title: Canonical
          type: string
        case_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Case Id
        contract_version:
          title: Contract Version
          type: string
        correlation_id:
          pattern: ^[0-9a-f]{32}$
          title: Correlation Id
          type: string
        delivery_status:
          anyOf:
          - enum:
            - entregada
            - no_entregada
            - pendiente_de_decision
            type: string
          - type: 'null'
          default: null
          title: Delivery Status
        entry_type:
          $ref: '#/components/schemas/EntryType'
        hash:
          title: Hash
          type: string
        idempotency_key:
          format: uuid
          title: Idempotency Key
          type: string
        model_version_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Model Version Id
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        payload:
          anyOf:
          - $ref: '#/components/schemas/RecommendationPayload'
          - $ref: '#/components/schemas/FailClosedPayload'
          - $ref: '#/components/schemas/HumanDecisionPayload'
          - $ref: '#/components/schemas/ExplanationViewPayload'
          - $ref: '#/components/schemas/ModelEventPayload'
          - $ref: '#/components/schemas/PolicyEventPayload'
          - $ref: '#/components/schemas/DataSourceEventPayload'
          - $ref: '#/components/schemas/FreezePayload'
          - $ref: '#/components/schemas/FrozenResolutionPayload'
          - $ref: '#/components/schemas/GenesisPayload'
          - $ref: '#/components/schemas/CheckpointPayload'
          title: Payload
        policy_version_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Policy Version Id
        prev_hash:
          title: Prev Hash
          type: string
        recorded_at:
          format: date-time
          title: Recorded At
          type: string
        seq:
          minimum: 0
          title: Seq
          type: integer
      required:
      - entry_type
      - actor
      - occurred_at
      - correlation_id
      - idempotency_key
      - payload
      - seq
      - prev_hash
      - hash
      - recorded_at
      - contract_version
      - canonical
      title: DossierEntry
      type: object
    EntryType:
      enum:
      - recommendation
      - fail_closed
      - human_decision
      - explanation_view
      - model_event
      - policy_event
      - data_source_event
      - freeze
      - frozen_resolution
      - genesis
      - checkpoint
      title: EntryType
      type: string
    Explanation:
      additionalProperties: false
      properties:
        base_value:
          pattern: ^-?\d+(\.\d+)?$
          title: Base Value
          type: string
        factuality_check:
          const: passed
          title: Factuality Check
          type: string
        feature_dictionary_version:
          title: Feature Dictionary Version
          type: string
        method:
          const: shap
          title: Method
          type: string
        model_version_id:
          title: Model Version Id
          type: string
        narrative:
          maxLength: 4000
          title: Narrative
          type: string
        narrative_generator:
          title: Narrative Generator
          type: string
        posthoc_notice:
          title: Posthoc Notice
          type: string
        shap_vector:
          items:
            $ref: '#/components/schemas/FeatureContribution'
          title: Shap Vector
          type: array
      required:
      - model_version_id
      - method
      - shap_vector
      - base_value
      - narrative
      - narrative_generator
      - feature_dictionary_version
      - posthoc_notice
      - factuality_check
      title: Explanation
      type: object
    ExplanationViewPayload:
      additionalProperties: false
      properties:
        recommendation_entry_id:
          title: Recommendation Entry Id
          type: string
        viewed_at:
          format: date-time
          title: Viewed At
          type: string
      required:
      - viewed_at
      - recommendation_entry_id
      title: ExplanationViewPayload
      type: object
    FailClosedCause:
      description: En el orden de precedencia de BR-U0-02 (BR-U0-03).
      enum:
      - model_frozen
      - serving_config_unavailable
      - model_output_invalid
      - timeout
      - explainer_unavailable
      - explainer_error
      - version_mismatch
      - feature_dictionary_incomplete
      - factuality_failed
      - registry_unavailable
      title: FailClosedCause
      type: string
    FailClosedPayload:
      additionalProperties: false
      properties:
        attempt:
          minimum: 1
          title: Attempt
          type: integer
        cause:
          anyOf:
          - $ref: '#/components/schemas/FailClosedCause'
          - type: 'null'
          default: null
        escalated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Escalated At
        local_cause:
          anyOf:
          - $ref: '#/components/schemas/LocalCause'
          - type: 'null'
          default: null
        retryable:
          title: Retryable
          type: boolean
      required:
      - retryable
      - attempt
      title: FailClosedPayload
      type: object
    FeatureContribution:
      additionalProperties: false
      properties:
        contribution:
          pattern: ^-?\d+(\.\d+)?$
          title: Contribution
          type: string
        feature_id:
          title: Feature Id
          type: string
        value:
          discriminator:
            mapping:
              category: '#/components/schemas/CategoryFeature'
              decimal: '#/components/schemas/DecimalFeature'
              int: '#/components/schemas/IntFeature'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/DecimalFeature'
          - $ref: '#/components/schemas/IntFeature'
          - $ref: '#/components/schemas/CategoryFeature'
          title: Value
      required:
      - feature_id
      - value
      - contribution
      title: FeatureContribution
      type: object
    FeatureVector:
      additionalProperties: false
      properties:
        features:
          additionalProperties:
            discriminator:
              mapping:
                category: '#/components/schemas/CategoryFeature'
                decimal: '#/components/schemas/DecimalFeature'
                int: '#/components/schemas/IntFeature'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/DecimalFeature'
            - $ref: '#/components/schemas/IntFeature'
            - $ref: '#/components/schemas/CategoryFeature'
          title: Features
          type: object
      required:
      - features
      title: FeatureVector
      type: object
    FinalOutcome:
      enum:
      - favorable
      - desfavorable
      title: FinalOutcome
      type: string
    FreezeContextPackage:
      additionalProperties: false
      description: '`FreezeContext` mas lo que agrega governance (BR-U9-16).'
      properties:
        affected_volume:
          title: Affected Volume
          type: integer
        after:
          $ref: '#/components/schemas/DisparityResult'
        before:
          anyOf:
          - $ref: '#/components/schemas/DisparityResult'
          - const: sin_datos
            type: string
          title: Before
        computed_at:
          format: date-time
          title: Computed At
          type: string
        data_sources:
          items:
            $ref: '#/components/schemas/JsonValue'
          title: Data Sources
          type: array
        implicated:
          items:
            $ref: '#/components/schemas/JsonValue'
          title: Implicated
          type: array
        initial_disparity:
          $ref: '#/components/schemas/InitialDisparity'
        last_7_days:
          anyOf:
          - $ref: '#/components/schemas/DisparityResult'
          - const: sin_datos
            type: string
          title: Last 7 Days
        library_version:
          title: Library Version
          type: string
        model_version_id:
          title: Model Version Id
          type: string
        n_min:
          title: N Min
          type: integer
        schedule:
          title: Schedule
          type: string
        stale_after_s:
          title: Stale After S
          type: integer
        threshold_pp:
          pattern: ^-?\d+\.\d{4}$
          title: Threshold Pp
          type: string
        trigger_attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Trigger Attribute
          type: string
        truncated:
          title: Truncated
          type: boolean
        window_days:
          title: Window Days
          type: integer
        window_start:
          format: date
          title: Window Start
          type: string
      required:
      - model_version_id
      - computed_at
      - threshold_pp
      - n_min
      - window_days
      - schedule
      - stale_after_s
      - library_version
      - window_start
      - before
      - after
      - last_7_days
      - trigger_attribute
      - implicated
      - affected_volume
      - truncated
      - data_sources
      - initial_disparity
      title: FreezeContextPackage
      type: object
    FreezePayload:
      additionalProperties: false
      properties:
        context_package:
          $ref: '#/components/schemas/FreezeContextPackage'
        freeze_id:
          title: Freeze Id
          type: string
        frozen_at:
          format: date-time
          title: Frozen At
          type: string
      required:
      - freeze_id
      - frozen_at
      - context_package
      title: FreezePayload
      type: object
    FreezeRecord:
      additionalProperties: false
      properties:
        context_package:
          $ref: '#/components/schemas/FreezeContextPackage'
        freeze_id:
          title: Freeze Id
          type: string
        frozen_at:
          format: date-time
          title: Frozen At
          type: string
        model_version_id:
          title: Model Version Id
          type: string
        resolutions:
          items:
            $ref: '#/components/schemas/Resolution'
          title: Resolutions
          type: array
      required:
      - freeze_id
      - model_version_id
      - frozen_at
      - context_package
      - resolutions
      title: FreezeRecord
      type: object
    FrozenResolutionPayload:
      additionalProperties: false
      properties:
        action:
          enum:
          - reactivar
          - descartar
          - investigar
          title: Action
          type: string
        justification:
          maxLength: 2000
          title: Justification
          type: string
      required:
      - action
      - justification
      title: FrozenResolutionPayload
      type: object
    GenesisPayload:
      additionalProperties: false
      properties:
        checkpoint_key_fingerprint:
          title: Checkpoint Key Fingerprint
          type: string
        contract_version:
          title: Contract Version
          type: string
        schema_version:
          title: Schema Version
          type: string
      required:
      - schema_version
      - contract_version
      - checkpoint_key_fingerprint
      title: GenesisPayload
      type: object
    HumanDecisionPayload:
      additionalProperties: false
      properties:
        decided_at:
          format: date-time
          title: Decided At
          type: string
        decision:
          $ref: '#/components/schemas/Decision'
        explanation_viewed_before:
          title: Explanation Viewed Before
          type: boolean
        final_outcome:
          $ref: '#/components/schemas/FinalOutcome'
        justification:
          maxLength: 2000
          title: Justification
          type: string
        recommendation_entry_id:
          title: Recommendation Entry Id
          type: string
        used_factors:
          items:
            type: string
          title: Used Factors
          type: array
      required:
      - decision
      - final_outcome
      - used_factors
      - justification
      - explanation_viewed_before
      - decided_at
      - recommendation_entry_id
      title: HumanDecisionPayload
      type: object
    InitialDisparity:
      additionalProperties: false
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResult'
          title: Attributes
          type: array
        model_aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Model Aggregate
        n_min:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: N Min
        rule_met:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Rule Met
        threshold_pp:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Threshold Pp
        trigger_attribute:
          anyOf:
          - enum:
            - sexo
            - rango_edad
            - region
            - estrato
            type: string
          - type: 'null'
          default: null
          title: Trigger Attribute
      required:
      - attributes
      title: InitialDisparity
      type: object
    IntFeature:
      additionalProperties: false
      properties:
        type:
          const: int
          default: int
          title: Type
          type: string
        value:
          title: Value
          type: integer
      required:
      - value
      title: IntFeature
      type: object
    IntegrityCheckRef:
      additionalProperties: false
      properties:
        already_active:
          title: Already Active
          type: boolean
        check_id:
          title: Check Id
          type: string
        mode:
          enum:
          - full
          - range
          title: Mode
          type: string
        requested_at:
          format: date-time
          title: Requested At
          type: string
      required:
      - check_id
      - mode
      - requested_at
      - already_active
      title: IntegrityCheckRef
      type: object
    IntegrityCheckRequest:
      additionalProperties: false
      properties:
        from_seq:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: From Seq
        mode:
          enum:
          - full
          - range
          title: Mode
          type: string
        to_seq:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: To Seq
      required:
      - mode
      title: IntegrityCheckRequest
      type: object
    IntegrityCheckStatus:
      additionalProperties: false
      properties:
        check_id:
          title: Check Id
          type: string
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Finished At
        mode:
          enum:
          - full
          - range
          title: Mode
          type: string
        progress:
          $ref: '#/components/schemas/Progress'
        reason:
          anyOf:
          - enum:
            - interrumpida
            - error_de_ejecucion
            - plazo_vencido
            type: string
          - type: 'null'
          default: null
          title: Reason
        report:
          anyOf:
          - $ref: '#/components/schemas/IntegrityReport'
          - type: 'null'
          default: null
        requested_at:
          format: date-time
          title: Requested At
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Started At
        status:
          enum:
          - pendiente
          - en_curso
          - terminada
          - fallida
          title: Status
          type: string
      required:
      - check_id
      - mode
      - status
      - progress
      - requested_at
      title: IntegrityCheckStatus
      type: object
    IntegrityReport:
      additionalProperties: false
      properties:
        checkpoints_checked:
          title: Checkpoints Checked
          type: integer
        entries_checked:
          title: Entries Checked
          type: integer
        finished_at:
          format: date-time
          title: Finished At
          type: string
        first_inconsistent_seq:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: First Inconsistent Seq
        from_seq:
          title: From Seq
          type: integer
        mode:
          enum:
          - incremental
          - nightly
          - full
          - range
          title: Mode
          type: string
        reason:
          anyOf:
          - enum:
            - hash
            - link
            - checkpoint_signature
            - checkpoint_mismatch
            - seq_gap
            - column_mismatch
            type: string
          - type: 'null'
          default: null
          title: Reason
        result:
          enum:
          - integra
          - inconsistente
          - error
          title: Result
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        to_seq:
          title: To Seq
          type: integer
      required:
      - mode
      - from_seq
      - to_seq
      - entries_checked
      - checkpoints_checked
      - result
      - started_at
      - finished_at
      title: IntegrityReport
      type: object
    IntegrityStatus:
      additionalProperties: false
      properties:
        entries_checked:
          title: Entries Checked
          type: integer
        first_inconsistent_seq:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: First Inconsistent Seq
        from_checkpoint_seq:
          title: From Checkpoint Seq
          type: integer
        reason:
          anyOf:
          - enum:
            - hash
            - link
            - checkpoint_signature
            - checkpoint_mismatch
            - seq_gap
            - column_mismatch
            type: string
          - type: 'null'
          default: null
          title: Reason
        status:
          enum:
          - verified
          - not_verified
          title: Status
          type: string
        to_checkpoint_seq:
          anyOf:
          - type: integer
          - const: head
            type: string
          title: To Checkpoint Seq
