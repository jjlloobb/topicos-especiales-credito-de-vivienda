components:
  schemas:
    Actor:
      additionalProperties: false
      properties:
        acr:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Acr
        auth_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Auth Time
        id:
          title: Id
          type: string
        kind:
          enum:
          - user
          - service
          - system
          title: Kind
          type: string
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          default: null
      required:
      - kind
      - id
      title: Actor
      type: object
    AffectedVolume:
      additionalProperties: false
      description: Recomendaciones de la versión en la ventana y cuántas fueron `favorable`
        (U9 §3.1).
      properties:
        favorable:
          minimum: 0
          title: Favorable
          type: integer
        total:
          minimum: 0
          title: Total
          type: integer
      required:
      - total
      - favorable
      title: AffectedVolume
      type: object
    ApplicantFactor:
      additionalProperties: false
      properties:
        direction:
          enum:
          - aumenta
          - reduce
          title: Direction
          type: string
        label_es:
          title: Label Es
          type: string
      required:
      - label_es
      - direction
      title: ApplicantFactor
      type: object
    ApplicantSummary:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          title: Case Id
          type: string
        factors:
          items:
            $ref: '#/components/schemas/ApplicantFactor'
          title: Factors
          type: array
        generated_at:
          format: date-time
          title: Generated At
          type: string
        posthoc_notice:
          title: Posthoc Notice
          type: string
      required:
      - case_id
      - factors
      - posthoc_notice
      - generated_at
      title: ApplicantSummary
      type: object
    ApplicationIn:
      additionalProperties: false
      properties:
        address:
          maxLength: 300
          title: Address
          type: string
        birth_date:
          format: date
          title: Birth Date
          type: string
        broker_id:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          default: null
          title: Broker Id
        channel:
          maxLength: 40
          title: Channel
          type: string
        department_code:
          pattern: ^\d{2}$
          title: Department Code
          type: string
        document_number:
          maxLength: 15
          title: Document Number
          type: string
        document_type:
          enum:
          - CC
          - CE
          - PA
          - PPT
          title: Document Type
          type: string
        email:
          maxLength: 254
          title: Email
          type: string
        employment_months:
          maximum: 720
          minimum: 0
          title: Employment Months
          type: integer
        employment_type:
          enum:
          - asalariado
          - independiente
          - pensionado
          title: Employment Type
          type: string
        free_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Free Text
        full_name:
          maxLength: 200
          title: Full Name
          type: string
        max_days_past_due_12m:
          maximum: 365
          minimum: 0
          title: Max Days Past Due 12M
          type: integer
        monthly_income:
          maximum: 1000000000000
          minimum: 0
          title: Monthly Income
          type: integer
        monthly_obligations:
          maximum: 1000000000000
          minimum: 0
          title: Monthly Obligations
          type: integer
        municipality_code:
          pattern: ^\d{5}$
          title: Municipality Code
          type: string
        other_income:
          maximum: 1000000000000
          minimum: 0
          title: Other Income
          type: integer
        phone:
          maxLength: 20
          title: Phone
          type: string
        property_condition:
          enum:
          - nueva
          - usada
          title: Property Condition
          type: string
        property_value:
          maximum: 1000000000000
          minimum: 0
          title: Property Value
          type: integer
        proposed_rate_ea:
          pattern: ^-?\d+\.\d{4}$
          title: Proposed Rate Ea
          type: string
        requested_amount:
          maximum: 1000000000000
          minimum: 0
          title: Requested Amount
          type: integer
        sex:
          default: no_informado
          enum:
          - F
          - M
          - no_informado
          title: Sex
          type: string
        socioeconomic_stratum:
          default: no_informado
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - no_informado
          title: Socioeconomic Stratum
          type: string
        term_months:
          maximum: 360
          minimum: 12
          title: Term Months
          type: integer
      required:
      - full_name
      - document_type
      - document_number
      - birth_date
      - phone
      - email
      - address
      - municipality_code
      - department_code
      - monthly_income
      - other_income
      - employment_type
      - employment_months
      - monthly_obligations
      - max_days_past_due_12m
      - property_value
      - requested_amount
      - term_months
      - proposed_rate_ea
      - property_condition
      - channel
      title: ApplicationIn
      type: object
    ApplicationView:
      additionalProperties: false
      description: '`ApplicationIn` sin identificacion y sin etiquetas de monitoreo
        (§1.2).'
      properties:
        broker_id:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          default: null
          title: Broker Id
        channel:
          maxLength: 40
          title: Channel
          type: string
        department_code:
          pattern: ^\d{2}$
          title: Department Code
          type: string
        employment_months:
          maximum: 720
          minimum: 0
          title: Employment Months
          type: integer
        employment_type:
          enum:
          - asalariado
          - independiente
          - pensionado
          title: Employment Type
          type: string
        free_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Free Text
        max_days_past_due_12m:
          maximum: 365
          minimum: 0
          title: Max Days Past Due 12M
          type: integer
        monthly_income:
          maximum: 1000000000000
          minimum: 0
          title: Monthly Income
          type: integer
        monthly_obligations:
          maximum: 1000000000000
          minimum: 0
          title: Monthly Obligations
          type: integer
        other_income:
          maximum: 1000000000000
          minimum: 0
          title: Other Income
          type: integer
        property_condition:
          enum:
          - nueva
          - usada
          title: Property Condition
          type: string
        property_value:
          maximum: 1000000000000
          minimum: 0
          title: Property Value
          type: integer
        proposed_rate_ea:
          pattern: ^-?\d+\.\d{4}$
          title: Proposed Rate Ea
          type: string
        requested_amount:
          maximum: 1000000000000
          minimum: 0
          title: Requested Amount
          type: integer
        term_months:
          maximum: 360
          minimum: 12
          title: Term Months
          type: integer
      required:
      - department_code
      - monthly_income
      - other_income
      - employment_type
      - employment_months
      - monthly_obligations
      - max_days_past_due_12m
      - property_value
      - requested_amount
      - term_months
      - proposed_rate_ea
      - property_condition
      - channel
      title: ApplicationView
      type: object
    AttributeDelta:
      additionalProperties: false
      properties:
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        delta:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Delta
      required:
      - attribute
      title: AttributeDelta
      type: object
    AttributeResult:
      additionalProperties: false
      properties:
        aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Aggregate
        aggregate_ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Aggregate Ci 95
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        bands:
          items:
            $ref: '#/components/schemas/BandResult'
          title: Bands
          type: array
        cells:
          items:
            $ref: '#/components/schemas/CellResult'
          title: Cells
          type: array
        population_difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Population Difference
        population_difference_partial:
          title: Population Difference Partial
          type: boolean
      required:
      - attribute
      - cells
      - bands
      - population_difference_partial
      title: AttributeResult
      type: object
    BandResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Ci 95
        difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Difference
        extreme_pair:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Extreme Pair
        n_band:
          minimum: 0
          title: N Band
          type: integer
      required:
      - band
      - n_band
      title: BandResult
      type: object
    CaseDetail:
      additionalProperties: false
      properties:
        anonymized:
          title: Anonymized
          type: boolean
        applicant_display:
          title: Applicant Display
          type: string
        application:
          $ref: '#/components/schemas/ApplicationView'
        attempts:
          title: Attempts
          type: integer
        case_id:
          format: uuid
          title: Case Id
          type: string
        channel:
          maxLength: 40
          title: Channel
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        credit_status:
          anyOf:
          - $ref: '#/components/schemas/CreditStatus'
          - type: 'null'
          default: null
        decision:
          anyOf:
          - $ref: '#/components/schemas/DecisionView'
          - type: 'null'
          default: null
        identifiers:
          anyOf:
          - $ref: '#/components/schemas/CaseIdentifierGroup'
          - type: 'null'
          default: null
        last_cause:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Last Cause
        model_frozen_after_recommendation:
          title: Model Frozen After Recommendation
          type: boolean
        outcome:
          anyOf:
          - $ref: '#/components/schemas/Outcome'
          - type: 'null'
          default: null
        recommendation:
          anyOf:
          - $ref: '#/components/schemas/Recommendation'
          - type: 'null'
          default: null
        recommendation_entry_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Recommendation Entry Id
        score:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Score
        state:
          $ref: '#/components/schemas/CaseState'
      required:
      - case_id
      - state
      - channel
      - created_at
      - applicant_display
      - application
      - model_frozen_after_recommendation
      - anonymized
      - attempts
      title: CaseDetail
      type: object
    CaseFilter:
      additionalProperties: false
      properties:
        channel: &id001
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          default: null
          title: Channel
        created_from: &id002
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Created From
        created_to: &id003
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Created To
        model_frozen_after_recommendation: &id004
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Model Frozen After Recommendation
        page: &id005
          default: 1
          minimum: 1
          title: Page
          type: integer
        page_size: &id006
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        state: &id007
          anyOf:
          - items:
              $ref: '#/components/schemas/CaseState'
            type: array
          - type: 'null'
          default: null
          title: State
      title: CaseFilter
      type: object
    CaseIdentifierGroup:
      additionalProperties: false
      description: 'Grupo de identificacion de §1.1: nunca sale al registro (BR-U0-95).'
      properties:
        address:
          maxLength: 300
          title: Address
          type: string
        birth_date:
          format: date
          title: Birth Date
          type: string
        document_number:
          maxLength: 15
          title: Document Number
          type: string
        document_type:
          enum:
          - CC
          - CE
          - PA
          - PPT
          title: Document Type
          type: string
        email:
          maxLength: 254
          title: Email
          type: string
        full_name:
          maxLength: 200
          title: Full Name
          type: string
        municipality_code:
          pattern: ^\d{5}$
          title: Municipality Code
          type: string
        phone:
          maxLength: 20
          title: Phone
          type: string
      required:
      - full_name
      - document_type
      - document_number
      - birth_date
      - phone
      - email
      - address
      - municipality_code
      title: CaseIdentifierGroup
      type: object
    CaseRef:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          title: Case Id
          type: string
        state:
          $ref: '#/components/schemas/CaseState'
      required:
      - case_id
      - state
      title: CaseRef
      type: object
    CaseState:
      enum:
      - en_evaluacion
      - listo
      - en_sincronizacion
      - no_disponible
      - modelo_congelado
      - decidido
      - vencido
      title: CaseState
      type: string
    CaseSummary:
      additionalProperties: false
      properties:
        applicant_display:
          title: Applicant Display
          type: string
        case_id:
          format: uuid
          title: Case Id
          type: string
        channel:
          maxLength: 40
          title: Channel
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        outcome:
          anyOf:
          - $ref: '#/components/schemas/Outcome'
          - type: 'null'
          default: null
        score:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Score
        state:
          $ref: '#/components/schemas/CaseState'
      required:
      - case_id
      - state
      - channel
      - created_at
      - applicant_display
      title: CaseSummary
      type: object
    CategoryFeature:
      additionalProperties: false
      properties:
        type:
          const: category
          default: category
          title: Type
          type: string
        value:
          maxLength: 60
          title: Value
          type: string
      required:
      - value
      title: CategoryFeature
      type: object
    CellResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        n:
          minimum: 0
          title: N
          type: integer
        rate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Rate
        status:
          enum:
          - suficiente
          - muestra_insuficiente
          title: Status
          type: string
      required:
      - group
      - band
      - n
      - status
      title: CellResult
      type: object
    ChannelRule:
      additionalProperties: false
      properties:
        channel:
          title: Channel
          type: string
        cutoff:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Cutoff
      required:
      - channel
      title: ChannelRule
      type: object
    CheckpointPayload:
      additionalProperties: false
      properties:
        checkpoint_hash:
          title: Checkpoint Hash
          type: string
        checkpoint_seq:
          title: Checkpoint Seq
          type: integer
        key_fingerprint:
          title: Key Fingerprint
          type: string
        signature:
          title: Signature
          type: string
      required:
      - checkpoint_seq
      - checkpoint_hash
      - signature
      - key_fingerprint
      title: CheckpointPayload
      type: object
    ClientErrorReport:
      additionalProperties: false
      properties:
        app_version:
          pattern: ^\d+\.\d+\.\d+$
          title: App Version
          type: string
        correlation_id:
          anyOf:
          - pattern: ^[0-9a-f]{32}$
            type: string
          - type: 'null'
          default: null
          title: Correlation Id
        error_code:
          enum:
          - render_error
          - chunk_load_failed
          - unhandled_rejection
          - api_contract_mismatch
          - stepup_failed
          - csp_violation
          title: Error Code
          type: string
        route_template:
          maxLength: 200
          title: Route Template
          type: string
      required:
      - error_code
      - route_template
      - app_version
      title: ClientErrorReport
      type: object
    ConsoleDossier:
      additionalProperties: false
      properties:
        anonymized:
          title: Anonymized
          type: boolean
        dossier:
          $ref: '#/components/schemas/RegistryDossier'
        identifiers:
          anyOf:
          - $ref: '#/components/schemas/CaseIdentifierGroup'
          - type: 'null'
          default: null
        identifiers_unavailable:
          title: Identifiers Unavailable
          type: boolean
      required:
      - dossier
      - identifiers_unavailable
      - anonymized
      title: ConsoleDossier
      type: object
    CreditStatus:
      enum:
      - en_estudio
      - aprobado
      - desembolsado
      - rechazado
      - cancelado
      - sin_credito
      - no_disponible
      - no_integrado
      title: CreditStatus
      type: string
    DataSource:
      additionalProperties: false
      properties:
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Decided By
        description:
          title: Description
          type: string
        ds_id:
          title: Ds Id
          type: string
        name:
          title: Name
          type: string
        owner:
          title: Owner
          type: string
        pre_post_report:
          anyOf:
          - $ref: '#/components/schemas/PrePostReport'
          - type: 'null'
          default: null
        proposed_by:
          title: Proposed By
          type: string
        provides_features:
          items:
            type: string
          title: Provides Features
          type: array
        state:
          enum:
          - propuesta
          - en_evaluacion
          - aprobada
          - rechazada
          title: State
          type: string
      required:
      - name
      - description
      - provides_features
      - owner
      - ds_id
      - proposed_by
      - state
      title: DataSource
      type: object
    DataSourceDecisionIn:
      additionalProperties: false
      properties:
        decision:
          enum:
          - aprobada
          - rechazada
          title: Decision
          type: string
        justification:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Justification
      required:
      - decision
      title: DataSourceDecisionIn
      type: object
    DataSourceEventPayload:
      additionalProperties: false
      properties:
        event:
          enum:
          - propuesta
          - evaluacion_iniciada
          - aprobada
          - rechazada
          title: Event
          type: string
        pre_post_report:
          anyOf:
          - $ref: '#/components/schemas/PrePostReport'
          - type: 'null'
          default: null
        source_id:
          title: Source Id
          type: string
      required:
      - event
      - source_id
      title: DataSourceEventPayload
      type: object
    DataSourceProposal:
      additionalProperties: false
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        owner:
          title: Owner
          type: string
        provides_features:
          items:
            type: string
          title: Provides Features
          type: array
      required:
      - name
      - description
      - provides_features
      - owner
      title: DataSourceProposal
      type: object
    DayRange:
      additionalProperties: false
      properties:
        from_day:
          format: date
          title: From Day
          type: string
        to_day:
          format: date
          title: To Day
          type: string
      required:
      - from_day
      - to_day
      title: DayRange
      type: object
    DecimalFeature:
      additionalProperties: false
      properties:
        type:
          const: decimal
          default: decimal
          title: Type
          type: string
        value:
          pattern: ^-?\d+(\.\d+)?$
          title: Value
          type: string
      required:
      - value
      title: DecimalFeature
      type: object
    Decision:
      enum:
      - sigue
      - se_aparta
      - resuelve_revision
      title: Decision
      type: string
    DecisionIn:
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        final_outcome:
          $ref: '#/components/schemas/FinalOutcome'
        justification:
          maxLength: 2000
          title: Justification
          type: string
        used_factors:
          items:
            type: string
          title: Used Factors
          type: array
      required:
      - decision
      - final_outcome
      - used_factors
      - justification
      title: DecisionIn
      type: object
    DecisionRef:
      additionalProperties: false
      properties:
        case_id:
          format: uuid
          title: Case Id
          type: string
        recorded_at:
          format: date-time
          title: Recorded At
          type: string
        registry_entry_id:
          title: Registry Entry Id
          type: string
      required:
      - case_id
      - registry_entry_id
      - recorded_at
      title: DecisionRef
      type: object
    DecisionView:
      additionalProperties: false
      properties:
        decided_at:
          format: date-time
          title: Decided At
          type: string
        decided_by:
          title: Decided By
          type: string
        decision:
          $ref: '#/components/schemas/Decision'
        final_outcome:
          $ref: '#/components/schemas/FinalOutcome'
        justification:
          title: Justification
          type: string
        used_factors:
          items:
            type: string
          title: Used Factors
          type: array
      required:
      - decision
      - final_outcome
      - used_factors
      - justification
      - decided_at
      - decided_by
      title: DecisionView
      type: object
    DepartureRate:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        rate:
          pattern: ^-?\d+\.\d{4}$
          title: Rate
          type: string
      required:
      - group
      - band
      - rate
      title: DepartureRate
      type: object
    DisparityFilter:
      additionalProperties: false
      description: 'BR-U9-18: versión, atributo y ventana. Sin versión, bias usa la
        más reciente.'
      properties:
        attribute: &id009
          anyOf:
          - enum:
            - sexo
            - rango_edad
            - region
            - estrato
            type: string
