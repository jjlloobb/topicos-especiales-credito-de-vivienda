components:
  schemas:
    ActivationIn:
      additionalProperties: false
      properties:
        evidence:
          maxLength: 500
          title: Evidence
          type: string
      required:
      - evidence
      title: ActivationIn
      type: object
    AffectedVolume:
      additionalProperties: false
      description: Recomendaciones de la versión en la ventana y cuántas fueron `favorable`
        (U9 §3.1).
      properties:
        favorable:
          minimum: 0
          title: Favorable
          type: integer
        total:
          minimum: 0
          title: Total
          type: integer
      required:
      - total
      - favorable
      title: AffectedVolume
      type: object
    AttributeDelta:
      additionalProperties: false
      properties:
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        delta:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Delta
      required:
      - attribute
      title: AttributeDelta
      type: object
    AttributeResult:
      additionalProperties: false
      properties:
        aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Aggregate
        aggregate_ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Aggregate Ci 95
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        bands:
          items:
            $ref: '#/components/schemas/BandResult'
          title: Bands
          type: array
        cells:
          items:
            $ref: '#/components/schemas/CellResult'
          title: Cells
          type: array
        population_difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Population Difference
        population_difference_partial:
          title: Population Difference Partial
          type: boolean
      required:
      - attribute
      - cells
      - bands
      - population_difference_partial
      title: AttributeResult
      type: object
    BandResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        ci_95:
          anyOf:
          - items:
              pattern: ^-?\d+\.\d{4}$
              type: string
            type: array
          - type: 'null'
          default: null
          title: Ci 95
        difference:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Difference
        extreme_pair:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Extreme Pair
        n_band:
          minimum: 0
          title: N Band
          type: integer
      required:
      - band
      - n_band
      title: BandResult
      type: object
    CellResult:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        n:
          minimum: 0
          title: N
          type: integer
        rate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Rate
        status:
          enum:
          - suficiente
          - muestra_insuficiente
          title: Status
          type: string
      required:
      - group
      - band
      - n
      - status
      title: CellResult
      type: object
    ChannelRule:
      additionalProperties: false
      properties:
        channel:
          title: Channel
          type: string
        cutoff:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Cutoff
      required:
      - channel
      title: ChannelRule
      type: object
    CountCell:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        favorable:
          minimum: 0
          title: Favorable
          type: integer
        group:
          title: Group
          type: string
        total:
          minimum: 0
          title: Total
          type: integer
      required:
      - group
      - band
      - favorable
      - total
      title: CountCell
      type: object
    CountTable:
      additionalProperties: false
      properties:
        attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Attribute
          type: string
        cells:
          items:
            $ref: '#/components/schemas/CountCell'
          title: Cells
          type: array
      required:
      - attribute
      - cells
      title: CountTable
      type: object
    DataSource:
      additionalProperties: false
      properties:
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Decided By
        description:
          title: Description
          type: string
        ds_id:
          title: Ds Id
          type: string
        name:
          title: Name
          type: string
        owner:
          title: Owner
          type: string
        pre_post_report:
          anyOf:
          - $ref: '#/components/schemas/PrePostReport'
          - type: 'null'
          default: null
        proposed_by:
          title: Proposed By
          type: string
        provides_features:
          items:
            type: string
          title: Provides Features
          type: array
        state:
          enum:
          - propuesta
          - en_evaluacion
          - aprobada
          - rechazada
          title: State
          type: string
      required:
      - name
      - description
      - provides_features
      - owner
      - ds_id
      - proposed_by
      - state
      title: DataSource
      type: object
    DataSourceDecisionIn:
      additionalProperties: false
      properties:
        decision:
          enum:
          - aprobada
          - rechazada
          title: Decision
          type: string
        justification:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Justification
      required:
      - decision
      title: DataSourceDecisionIn
      type: object
    DataSourceProposal:
      additionalProperties: false
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        owner:
          title: Owner
          type: string
        provides_features:
          items:
            type: string
          title: Provides Features
          type: array
      required:
      - name
      - description
      - provides_features
      - owner
      title: DataSourceProposal
      type: object
    DepartureRate:
      additionalProperties: false
      properties:
        band:
          enum:
          - lt_20
          - '20_30'
          - gt_30
          title: Band
          type: string
        group:
          title: Group
          type: string
        rate:
          pattern: ^-?\d+\.\d{4}$
          title: Rate
          type: string
      required:
      - group
      - band
      - rate
      title: DepartureRate
      type: object
    DisparityResult:
      additionalProperties: false
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResult'
          title: Attributes
          type: array
        departure_rates:
          anyOf:
          - items:
              $ref: '#/components/schemas/DepartureRate'
            type: array
          - type: 'null'
          default: null
          title: Departure Rates
        model_aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Model Aggregate
        model_version_id:
          title: Model Version Id
          type: string
        population:
          enum:
          - modelo
          - humana
          title: Population
          type: string
        trigger_attribute:
          anyOf:
          - enum:
            - sexo
            - rango_edad
            - region
            - estrato
            type: string
          - type: 'null'
          default: null
          title: Trigger Attribute
        window_from:
          format: date
          title: Window From
          type: string
        window_to:
          format: date
          title: Window To
          type: string
      required:
      - population
      - model_version_id
      - window_from
      - window_to
      - attributes
      title: DisparityResult
      type: object
    FeatureDictionary:
      additionalProperties: false
      properties:
        dictionary_version:
          title: Dictionary Version
          type: string
        entries:
          items:
            $ref: '#/components/schemas/FeatureDictionaryEntry'
          title: Entries
          type: array
        model_version_id:
          title: Model Version Id
          type: string
      required:
      - dictionary_version
      - model_version_id
      - entries
      title: FeatureDictionary
      type: object
    FeatureDictionaryEntry:
      additionalProperties: false
      properties:
        applicant_safe:
          title: Applicant Safe
          type: boolean
        decreases_risk_phrase_es:
          maxLength: 160
          title: Decreases Risk Phrase Es
          type: string
        feature_id:
          title: Feature Id
          type: string
        increases_risk_phrase_es:
          maxLength: 160
          title: Increases Risk Phrase Es
          type: string
        label_es:
          maxLength: 80
          title: Label Es
          type: string
        unit:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          default: null
          title: Unit
      required:
      - feature_id
      - label_es
      - increases_risk_phrase_es
      - decreases_risk_phrase_es
      - applicant_safe
      title: FeatureDictionaryEntry
      type: object
    FeatureSpec:
      additionalProperties: false
      properties:
        features:
          items:
            $ref: '#/components/schemas/FeatureSpecItem'
          title: Features
          type: array
        model_version_id:
          title: Model Version Id
          type: string
      required:
      - model_version_id
      - features
      title: FeatureSpec
      type: object
    FeatureSpecItem:
      additionalProperties: false
      description: '`feature_spec.json` de U5: feature derivada, campo permitido o
        busqueda en tabla.'
      properties:
        default:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          default: null
          title: Default
        feature_id:
          title: Feature Id
          type: string
        origin:
          enum:
          - derived
          - field
          - lookup
          title: Origin
          type: string
        source_fields:
          default: []
          items:
            type: string
          title: Source Fields
          type: array
        table:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          default: null
          title: Table
      required:
      - feature_id
      - origin
      title: FeatureSpecItem
      type: object
    FreezeContext:
      additionalProperties: false
      properties:
        affected_volume:
          $ref: '#/components/schemas/AffectedVolume'
        after:
          $ref: '#/components/schemas/DisparityResult'
        before:
          anyOf:
          - $ref: '#/components/schemas/DisparityResult'
          - const: sin_datos
            type: string
          title: Before
        computed_at:
          format: date-time
          title: Computed At
          type: string
        implicated:
          items:
            $ref: '#/components/schemas/JsonValue'
          title: Implicated
          type: array
        last_7_days:
          anyOf:
          - $ref: '#/components/schemas/DisparityResult'
          - const: sin_datos
            type: string
          title: Last 7 Days
        library_version:
          title: Library Version
          type: string
        model_version_id:
          title: Model Version Id
          type: string
        n_min:
          title: N Min
          type: integer
        schedule:
          title: Schedule
          type: string
        stale_after_s:
          title: Stale After S
          type: integer
        threshold_pp:
          pattern: ^-?\d+\.\d{4}$
          title: Threshold Pp
          type: string
        trigger_attribute:
          enum:
          - sexo
          - rango_edad
          - region
          - estrato
          title: Trigger Attribute
          type: string
        truncated:
          title: Truncated
          type: boolean
        window_days:
          title: Window Days
          type: integer
        window_start:
          format: date
          title: Window Start
          type: string
      required:
      - model_version_id
      - computed_at
      - threshold_pp
      - n_min
      - window_days
      - schedule
      - stale_after_s
      - library_version
      - window_start
      - before
      - after
      - last_7_days
      - trigger_attribute
      - implicated
      - affected_volume
      - truncated
      title: FreezeContext
      type: object
    FrozenResolutionIn:
      additionalProperties: false
      properties:
        action:
          enum:
          - reactivar
          - descartar
          - investigar
          title: Action
          type: string
        justification:
          maxLength: 2000
          minLength: 1
          title: Justification
          type: string
      required:
      - action
      - justification
      title: FrozenResolutionIn
      type: object
    InitialDisparity:
      additionalProperties: false
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResult'
          title: Attributes
          type: array
        model_aggregate:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Model Aggregate
        n_min:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: N Min
        rule_met:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Rule Met
        threshold_pp:
          anyOf:
          - pattern: ^-?\d+\.\d{4}$
            type: string
          - type: 'null'
          default: null
          title: Threshold Pp
        trigger_attribute:
          anyOf:
          - enum:
            - sexo
            - rango_edad
            - region
            - estrato
            type: string
          - type: 'null'
          default: null
          title: Trigger Attribute
      required:
      - attributes
      title: InitialDisparity
      type: object
    InvalidParam:
      additionalProperties: false
      properties:
        name:
          title: Name
          type: string
        reason_code:
          title: Reason Code
          type: string
      required:
      - name
      - reason_code
      title: InvalidParam
      type: object
    JsonValue: {}
    ModelApprovalIn:
      additionalProperties: false
      properties:
        decision:
          enum:
          - aprobado
          - rechazado
          title: Decision
          type: string
        justification:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Justification
      required:
      - decision
      title: ModelApprovalIn
      type: object
    ModelFilter:
      additionalProperties: false
      description: '`GET /v1/models?state=activo,congelado`: uno o varios estados.'
      properties:
        page: &id001
          default: 1
          minimum: 1
          title: Page
          type: integer
        page_size: &id002
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        state: &id003
          anyOf:
          - items:
              enum:
              - registrado
              - en_validacion
              - validacion_fallida
              - lista_para_aprobacion
              - aprobado
              - rechazado
              - activo
              - inactivo
              - congelado
              - retirado
              type: string
            type: array
          - type: 'null'
          default: null
          title: State
      title: ModelFilter
      type: object
    ModelRegistration:
      additionalProperties: false
      properties:
        artifact_format:
          enum:
          - onnx
          - xgboost_json
          - xgboost_ubj
          - lightgbm_txt
