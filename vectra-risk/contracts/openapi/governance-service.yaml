    NormativeParams:
      additionalProperties: false
      properties:
        effective_from:
          format: date
          title: Effective From
          type: string
        effective_to:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          default: null
          title: Effective To
        source_ref:
          maxLength: 300
          title: Source Ref
          type: string
        usury_cap_ea:
          pattern: ^-?\d+\.\d{4}$
