        artifact_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Artifact Sha256
          type: string
        artifact_uri:
          title: Artifact Uri
          type: string
        data_sources:
          default: []
          items:
            type: string
          title: Data Sources
          type: array
        explainer_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Explainer Sha256
          type: string
        explainer_uri:
          title: Explainer Uri
          type: string
        manifest_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Manifest Sha256
          type: string
        manifest_uri:
          title: Manifest Uri
          type: string
        source_candidate_for:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source Candidate For
      required:
      - artifact_uri
      - artifact_format
      - artifact_sha256
      - explainer_uri
      - explainer_sha256
      - manifest_uri
      - manifest_sha256
      title: ModelRegistration
      type: object
