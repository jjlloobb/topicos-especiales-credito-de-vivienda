[project]
name = "vectra-contracts"
version = "0.1.0"
description = "Tipos, invariantes y catalogos de Vectra Risk (U0)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_contracts"]
