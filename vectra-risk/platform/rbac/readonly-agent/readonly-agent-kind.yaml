# Solo kind (U01-T17). La identidad con la que corren los agentes del loop: lee para diagnosticar y no escribe ni lee un Secret.
# `platform/kind/readonly-kubeconfig.sh write` arma con su token un kubeconfig fuera del repositorio. Staging y prod no la tienen.
# Sin comodines (disallow-rbac-wildcards, Enforce): el ClusterRole integrado `view` no sirve. Es un rol agregado, y lo que trae lo decide cualquier chart
# que lo etiquete; ademas no cubre los nodos, las PersistentVolume, las CRD, las metricas ni los recursos propios (Argo CD, ESO, CNPG, Kyverno, Gateway,
# KServe, Linkerd, Prometheus), que es lo que hace falta para diagnosticar. Aqui cada regla lista solo get, list y watch.
# Ausente a proposito: secrets, pods/exec, pods/portforward, pods/attach, cualquier verbo de escritura, impersonate, escalate y bind.
# El Secret de abajo es el token de larga vida de la ServiceAccount (el controlador de tokens lo llena). Es la unica copia: el valor no esta en Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vectra-readonly-agent
  namespace: argocd
---
apiVersion: v1
kind: Secret
metadata:
  name: vectra-readonly-agent-token
  namespace: argocd
  annotations:
    kubernetes.io/service-account.name: vectra-readonly-agent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
