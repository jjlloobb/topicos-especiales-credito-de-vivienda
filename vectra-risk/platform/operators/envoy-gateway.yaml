# INF-U2-02: el data plane corre en el namespace del Gateway (`vectra-edge`), no en `envoy-gateway-system`.
# U02-T10 (Paso 8): 2 replicas con la eleccion de lider del chart (NFR-U2-03), `vectra-high` (logical-components §1),
# recursos de INF-U2-06 y EnvoyPatchPolicy habilitada (P-U2-01, alternativa 2). Sin `rateLimit` (W1, INF-U2-03).
deployment:
  replicas: 2
  priorityClassName: vectra-high
  envoyGateway:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
config:
  envoyGateway:
    extensionApis:
      enableEnvoyPatchPolicy: true
    provider:
      type: Kubernetes
      kubernetes:
        deploy:
          type: GatewayNamespace
        # X3: el sidecar `shutdown-manager` de cada pod de Envoy corre en `vectra-edge` y toma su imagen de aqui, no del EnvoyProxy.
        # Espejo de `docker.io/envoyproxy/gateway:v1.9.3` con el digest de upstream. En kind el registro es
        # `kind-registry:5000/vectra/envoy-gateway`: ese cambio entra con el `kind_values` de la integracion (candidata).
        shutdownManager:
          image: registro.banco.internal/vectra/envoy-gateway@sha256:192fc9bdadb6d2462e8cf7bd702ce3dd9648f3310c6038787448a1f509b7cd9f
