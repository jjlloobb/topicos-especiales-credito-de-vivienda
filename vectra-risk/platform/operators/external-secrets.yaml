# K11 (`platform/secrets/eso-rbac-k11.yaml`) limita los Secret a los namespaces de Vectra.
replicaCount: 2
# El certificado del webhook lo emite cert-manager y cainjector inyecta su CA: sin `cert-controller`, ESO no escribe
# sus propios webhooks ni CRDs (antes, excepcion AVD-KSV-0114).
certController: { create: false }
webhook:
  replicaCount: 2
  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      issuerRef: { group: cert-manager.io, kind: Issuer, name: external-secrets-webhook } # eso-rbac-cluster.yaml
rbac: { create: false } # lo reemplaza platform/secrets/eso-rbac-cluster.yaml
