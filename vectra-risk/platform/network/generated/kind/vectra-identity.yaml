apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: vectra-identity
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vectra-identity
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F05
  name: allow-f05-to-keycloak-ingress
  namespace: vectra-identity
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-edge
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: api-gateway
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
  - Ingress
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: keycloak-8443
  namespace: vectra-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  port: 8443
  proxyProtocol: unknown
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: f05-keycloak-8443-mtls
  namespace: vectra-identity
spec:
  identities:
  - api-gateway.vectra-edge.serviceaccount.identity.linkerd.cluster.local
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: f05-keycloak-8443
  namespace: vectra-identity
spec:
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: f05-keycloak-8443-mtls
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: keycloak-8443
---
