---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F80
  name: allow-f80-cloudnative-pg-to-case-db-egress
  namespace: cnpg-system
spec:
  egress:
  - ports:
    - port: 8000
      protocol: TCP
    - port: 5432
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-data
      podSelector:
        matchLabels:
          cnpg.io/cluster: case-db
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
  - Egress
---
