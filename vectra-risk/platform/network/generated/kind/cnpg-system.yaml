---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F126
  name: allow-f126-k8s-api
  namespace: cnpg-system
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 172.18.0.0/16
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
