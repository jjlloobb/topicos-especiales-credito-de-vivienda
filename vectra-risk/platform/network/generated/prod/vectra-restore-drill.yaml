apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: vectra-restore-drill
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vectra-restore-drill
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F114
  name: allow-f114-restore-drill-to-restore-cluster-egress
  namespace: vectra-restore-drill
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-restore-drill
      podSelector:
        matchLabels:
          app.kubernetes.io/name: restore-cluster
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-drill
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F114
  name: allow-f114-to-restore-cluster-ingress
  namespace: vectra-restore-drill
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-restore-drill
      podSelector:
        matchLabels:
          app.kubernetes.io/name: restore-drill
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-cluster
  policyTypes:
  - Ingress
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: restore-cluster-5432
  namespace: vectra-restore-drill
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-cluster
  port: 5432
  proxyProtocol: opaque
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: f114-restore-cluster-5432-mtls
  namespace: vectra-restore-drill
spec:
  identities:
  - restore-drill.vectra-restore-drill.serviceaccount.identity.linkerd.cluster.local
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: f114-restore-cluster-5432
  namespace: vectra-restore-drill
spec:
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: f114-restore-cluster-5432-mtls
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: restore-cluster-5432
---
