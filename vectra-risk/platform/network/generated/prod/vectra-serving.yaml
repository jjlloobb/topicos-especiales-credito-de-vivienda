apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: vectra-serving
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vectra-serving
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F19
  name: allow-f19-to-predictor-ingress
  namespace: vectra-serving
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-app
      podSelector:
        matchLabels:
          app.kubernetes.io/name: scoring-service
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      vectra.io/component: predictor
  policyTypes:
  - Ingress
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: predictor-8080
  namespace: vectra-serving
spec:
  podSelector:
    matchLabels:
      vectra.io/component: predictor
  port: 8080
  proxyProtocol: unknown
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: f19-predictor-8080-mtls
  namespace: vectra-serving
spec:
  identities:
  - scoring-service.vectra-app.serviceaccount.identity.linkerd.cluster.local
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: f19-predictor-8080
  namespace: vectra-serving
spec:
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: f19-predictor-8080-mtls
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: predictor-8080
---
