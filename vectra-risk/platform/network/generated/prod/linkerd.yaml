apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: linkerd
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: linkerd
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F125
  name: allow-f125-same-namespace-ingress
  namespace: linkerd
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: linkerd
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F125
  name: allow-f125-same-namespace-egress
  namespace: linkerd
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: linkerd
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F126
  name: allow-f126-k8s-api
  namespace: linkerd
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/32
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F127
  name: allow-f127-webhooks
  namespace: linkerd
spec:
  ingress:
  - ports:
    - port: 8443
      protocol: TCP
    - port: 9443
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F128
  name: allow-f128-to-linkerd-control-ingress
  namespace: linkerd
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 9996
      protocol: TCP
  podSelector:
    matchLabels:
      linkerd.io/control-plane-ns: linkerd
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F83
  name: allow-f83-to-linkerd-control-ingress
  namespace: linkerd
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-edge
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-app
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-serving
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-data
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-identity
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-observability
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-restore-drill
    ports:
    - port: 8086
      protocol: TCP
    - port: 8080
      protocol: TCP
    - port: 8090
      protocol: TCP
  podSelector:
    matchLabels:
      linkerd.io/control-plane-ns: linkerd
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
