apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: envoy-gateway-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: envoy-gateway-system
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F125
  name: allow-f125-same-namespace-ingress
  namespace: envoy-gateway-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F125
  name: allow-f125-same-namespace-egress
  namespace: envoy-gateway-system
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F126
  name: allow-f126-k8s-api
  namespace: envoy-gateway-system
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/32
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F60
  name: allow-f60-to-rate-limit-ingress
  namespace: envoy-gateway-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 19001
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ratelimit
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy-ratelimit
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F61
  name: allow-f61-rate-limit-to-opentelemetry-collector-egress
  namespace: envoy-gateway-system
spec:
  egress:
  - ports:
    - port: 4317
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ratelimit
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy-ratelimit
  policyTypes:
  - Egress
---
