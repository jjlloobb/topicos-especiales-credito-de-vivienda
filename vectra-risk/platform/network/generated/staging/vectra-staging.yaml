apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: vectra-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vectra-staging
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F30
  name: allow-f30-model-validation-job-to-staging-isvc-egress
  namespace: vectra-staging
spec:
  egress:
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-staging
      podSelector:
        matchLabels:
          vectra.io/component: predictor
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-validation-job
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    vectra.io/flow: F30
  name: allow-f30-to-staging-isvc-ingress
  namespace: vectra-staging
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vectra-staging
      podSelector:
        matchLabels:
          app.kubernetes.io/name: model-validation-job
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      vectra.io/component: predictor
  policyTypes:
  - Ingress
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: staging-isvc-8080
  namespace: vectra-staging
spec:
  podSelector:
    matchLabels:
      vectra.io/component: predictor
  port: 8080
  proxyProtocol: unknown
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: f30-staging-isvc-8080-mtls
  namespace: vectra-staging
spec:
  identities:
  - model-validation-job.vectra-staging.serviceaccount.identity.linkerd.cluster.local
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: f30-staging-isvc-8080
  namespace: vectra-staging
spec:
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: f30-staging-isvc-8080-mtls
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: staging-isvc-8080
---
apiVersion: networking.k8s.io/v1
