apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: governance-service-console
  namespace: vectra-app
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: governance-service-8080
  rules:
  - matches:
    - method: POST
      path:
        type: Exact
        value: /v1/models
    - method: GET
      path:
        type: RegularExpression
        value: /v1/models/[^/]+
    - method: POST
      path:
        type: RegularExpression
        value: /v1/models/[^/]+/(validations|approval|frozen-resolution|retirement)
    - method: GET
      path: &id001
        type: RegularExpression
        value: /v1/policies(/.*)?
    - method: POST
      path: *id001
    - method: GET
      path: &id002
        type: RegularExpression
        value: /v1/data-sources(/.*)?
    - method: POST
      path: *id002
