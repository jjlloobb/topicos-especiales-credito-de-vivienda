# Unica fuente de los flujos permitidos (P-U1-01). Refleja component-dependency.md.
# Extremo: nombre de `workloads`, `ns:<namespace>` (todos sus pods) o `external:<nombre>`.
meshed_namespaces: [vectra-edge, vectra-app, vectra-serving, vectra-staging, vectra-data, vectra-identity, vectra-mock, vectra-observability, vectra-restore-drill]
system_namespaces: [cnpg-system, cert-manager, linkerd, kyverno, external-secrets, envoy-gateway-system, argocd, kserve, vault]
#: En kind F22 se puede deshabilitar para el PR de RT-3 (BR-U12-04); nunca en staging ni en produccion.
env_disabled: { kind: [], staging: [], prod: [] }
#: Rango de pods para la NetworkAuthentication de F80. 0.0.0.0/32 no autoriza a nadie hasta que el banco entregue el rango.
pod_cidr: { kind: 192.168.0.0/16, staging: 0.0.0.0/32, prod: 0.0.0.0/32 }
#: Destino real de la API de Kubernetes (Calico evalua tras el DNAT). En kind, la red de Docker: compruebalo en el Paso 19.
api_server_cidr: { kind: 172.18.0.0/16, staging: 0.0.0.0/32, prod: 0.0.0.0/32 }
#: Origen de las sondas del kubelet, que Linkerd no autoriza solo en un `Server` con rutas.
#: Tambien se admite pod_cidr: kubelet puede salir con la IP de tunl0 de Calico (issue 7).
node_cidr: { kind: 172.18.0.0/16, staging: 0.0.0.0/32, prod: 0.0.0.0/32 }
#: Operadores de la plataforma: dentro del namespace se hablan libremente (F125), todos llegan a la API (F126)
#: y la API llega a sus webhooks (F127). No llevan datos de negocio ni estan mallados.
system_internal:
  argocd: { webhooks: [] }
  cert-manager: { webhooks: [10250] }
  cnpg-system: { webhooks: [9443] }
  envoy-gateway-system: { webhooks: [] }
  external-secrets: { webhooks: [10250] }
  kserve: { webhooks: [9443] }
  kyverno: { webhooks: [9443] }
  linkerd: { webhooks: [8443, 9443] }
  vault: { webhooks: [8080] }
#: P-U1-13: lo que cada identidad puede hacer en el Pushgateway.
http_routes:
  governance-service:
    _catch_all: governance-catch-all # sin autorizacion: da 403 del proxy (X04, INF-U12-02)
    # Linkerd elige una sola ruta por solicitud y autoriza solo contra esa: una ruta por camino, con todos sus clientes,
    # y sin solapes (lo comprueba test_flows contra las rutas de U0).
    _routes:
      serving-config:
        sources: [scoring-service, case-service, case-worker]
        matches: [{ methods: [GET], exact: /v1/serving-config }]
      feature-dictionary:
        sources: [explainability-service]
        matches: [{ methods: [GET], regex: "/v1/models/[^/]+/feature-dictionary" }]
      feature-spec:
        sources: [case-worker]
        matches: [{ methods: [GET], regex: "/v1/models/[^/]+/feature-spec" }]
      freeze:
        sources: [bias-monitoring-job]
        matches: [{ methods: [POST], regex: "/v1/models/[^/]+/freeze" }]
      validation-results:
        sources: [model-validation-job]
        matches:
          - { methods: [PUT], regex: "/v1/validation-runs/[^/]+/source-counts" }
          - { methods: [PUT], regex: "/v1/models/[^/]+/validation-report" }
      model-list:
        sources: [console-bff, api-gateway]
        matches: [{ methods: [GET], exact: /v1/models }]
      activation:
        sources: [api-gateway]
        matches: [{ methods: [POST], regex: "/v1/models/[^/]+/activation" }]
      console:
        sources: [console-bff]
        matches:
          - { methods: [POST], exact: /v1/models }
          - { methods: [GET], regex: "/v1/models/[^/]+" }
          - { methods: [POST], regex: "/v1/models/[^/]+/(validations|approval|frozen-resolution|retirement)" }
          - { methods: [GET, POST], group: /v1/policies }
          - { methods: [GET, POST], group: /v1/data-sources }
  core-banking-mock:
    _catch_all: core-mock-catch-all # la serie `route_name` de CoreWriteAttempt (INF-U8-03)
    case-service: [{ methods: [GET], regex: "/v1/credits/[^/]+" }]
  prometheus-pushgateway: # etiqueta del chart
    _probes: ["/-/healthy", "/-/ready"]
    bias-monitoring-job:
      - { methods: [PUT, DELETE], group: /metrics/job/bias-monitoring }
      - { methods: [GET], exact: /api/v1/metrics }
    restore-drill: [{ methods: [PUT], group: /metrics/job/restore-drill }]
    realm-drift: [{ methods: [PUT], group: /metrics/job/realm-drift }]
    signing-key-age: [{ methods: [PUT], group: /metrics/job/signing-key-age }]
    grafana-folder-check: [{ methods: [PUT], group: /metrics/job/grafana-folder-permissions }]
    prometheus: [{ methods: [GET], exact: /metrics }]
