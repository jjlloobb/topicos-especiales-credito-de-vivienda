# MinIO distribuido (INF-U1-03; NFR-U1-30). Con una zona caida se lee, pero no se escribe (MinioWriteQuorumLost).
mode: distributed
# Imagenes propias (ver Dockerfile); el digest se reemplaza al publicarlas.
image: { repository: registro.vectra.internal/minio, tag: "RELEASE.2025-10-15T17-29-55Z@sha256:639cf7c92dbabea8fb8bc19479051182340f16f74e605154d32ddd38a6d0fba8" }
mcImage: { repository: registro.vectra.internal/mc, tag: "RELEASE.2025-08-13T08-35-41Z@sha256:14a8a8b3e3cc7989195f2a697aa6ee9e75cee58d83a9f60305e2490ae79325e2" }
replicas: 4
pools: 1
drivesPerNode: 1
persistence: { size: 200Gi, storageClass: vectra-encrypted }
priorityClassName: vectra-critical
tolerations:
  - { key: vectra.io/pool, operator: Equal, value: data, effect: NoSchedule }
topologySpreadConstraints:
  - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: minio } } }
resources:
  requests: { cpu: "1", memory: 4Gi }
  limits: { cpu: "2", memory: 8Gi }
metrics: { serviceMonitor: { enabled: true } }
existingSecret: minio-root
additionalLabels: { vectra.io/criticality: high }
securityContext: { enabled: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
containerSecurityContext: &container { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
postJob:
  securityContext: { enabled: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
makePolicyJob: &job
  securityContext: { enabled: true, runAsUser: 65532, runAsGroup: 65532 }
  containerSecurityContext: *container
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
makeBucketJob: *job
makeUserJob: *job
customCommandJob: *job
buckets:
  - { name: model-store, policy: none, purge: false, versioning: true, objectlocking: false }
  - { name: validation-datasets, policy: none, purge: false, versioning: true, objectlocking: false }
  - { name: loki, policy: none, purge: false, versioning: true, objectlocking: true }
  - { name: tempo, policy: none, purge: false, versioning: false, objectlocking: false }
policies:
  - { name: model-store-read, statements: [{ actions: ["s3:GetObject", "s3:ListBucket"], resources: ["arn:aws:s3:::model-store", "arn:aws:s3:::model-store/*"] }] }
  - { name: validation-read, statements: [{ actions: ["s3:GetObject", "s3:ListBucket"], resources: ["arn:aws:s3:::validation-datasets", "arn:aws:s3:::validation-datasets/*"] }] }
  - { name: loki-write, statements: [{ actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"], resources: ["arn:aws:s3:::loki", "arn:aws:s3:::loki/*"] }] }
  - { name: tempo-write, statements: [{ actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"], resources: ["arn:aws:s3:::tempo", "arn:aws:s3:::tempo/*"] }] }
  # F47: governance verifica el checksum leyendo el model-store. El diseno no le da `validation-datasets`.
  - { name: governance-read, statements: [{ actions: ["s3:GetObject", "s3:ListBucket"], resources: ["arn:aws:s3:::model-store", "arn:aws:s3:::model-store/*"] }] }
  # F101: `model-archive` lee aqui y escribe en el S3 del banco (F100). En kind el destino es MinIO: ver values-kind.yaml.
  - { name: model-archive, statements: [{ actions: ["s3:GetObject", "s3:ListBucket"], resources: ["arn:aws:s3:::model-store", "arn:aws:s3:::model-store/*"] }] }
  # NFR-U5-03: subida de la release a mano por el ingeniero de riesgo. Sin DeleteObject: el bucket es versionado.
  - { name: model-store-upload, statements: [{ actions: ["s3:GetObject", "s3:PutObject", "s3:ListBucket"], resources: ["arn:aws:s3:::model-store", "arn:aws:s3:::model-store/*"] }] }
users:
  - { accessKey: kserve-readonly, existingSecret: minio-kserve, existingSecretKey: secretKey, policy: model-store-read }
  - { accessKey: validation-readonly, existingSecret: minio-validation, existingSecretKey: secretKey, policy: validation-read }
  - { accessKey: loki-writer, existingSecret: minio-loki, existingSecretKey: secretKey, policy: loki-write }
  - { accessKey: tempo-writer, existingSecret: minio-tempo, existingSecretKey: secretKey, policy: tempo-write }
  - { accessKey: governance-readonly, existingSecret: minio-governance, existingSecretKey: secretKey, policy: governance-read }
  - { accessKey: model-archive-writer, existingSecret: minio-model-archive, existingSecretKey: secretKey, policy: model-archive }
  - { accessKey: risk-engineer-upload, existingSecret: minio-engineer-upload, existingSecretKey: secretKey, policy: model-store-upload }
# Estos comandos corren en cada hook post-upgrade, es decir, en cada sync.
# `retention set` reemplaza la configuracion del bucket. Sin verificar: si repetir `ilm rule add` deja reglas duplicadas
# (cada una con su ID) y si importa, porque todas expiran igual.
# NFR-U1-30: el lock de 90 dias protege; el lifecycle borra. Las dos banderas existen en `cmd/ilm-rule-add.go` del tag
# RELEASE.2025-08-13T08-35-41Z de mc; sin verificar contra un MinIO real que borre chunks vencidos sobre un bucket con lock.
customCommands:
  - { command: "retention set --default GOVERNANCE 90d myminio/loki" }
  - { command: "ilm rule add --expire-days 90 --noncurrent-expire-days 1 myminio/loki" }
  - { command: "ilm rule add --expire-days 7 myminio/tempo" }
