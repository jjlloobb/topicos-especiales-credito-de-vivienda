# Linkerd en HA con CNI (P-U1-02, 06; NFR-U1-21). Sin NET_ADMIN en los pods.
cniEnabled: true
controllerReplicas: 3
enablePodAntiAffinity: true
enablePodDisruptionBudget: true
identity:
  externalCA: true # la raiz la publica el ConfigMap linkerd-identity-trust-roots
  issuer:
    scheme: kubernetes.io/tls # lo gestiona cert-manager
# Sin el CronJob que envia version, UUID de instalacion y conteos a versioncheck.linkerd.io: nada sale del cluster del banco.
disableHeartBeat: true
proxy:
  defaultInboundPolicy: deny
  # Con `transport-header`, por omision, los proxies se conectan al 4143 y una NetworkPolicy por puerto de aplicacion los corta.
  outboundTransportMode: transparent
  nativeSidecar: true
  resources: # P-U1-14
    cpu: { request: 100m, limit: 500m }
    memory: { request: 20Mi, limit: 128Mi }
priorityClassName: vectra-critical
