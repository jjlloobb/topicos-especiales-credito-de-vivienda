# Jerarquia completa: autofirmado -> CA interna (borde, PostgreSQL) y autofirmado -> trust anchor de Linkerd.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: vectra-selfsigned }
spec: { selfSigned: {} }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: vectra-internal-ca, namespace: cert-manager }
spec:
  isCA: true
  commonName: vectra-internal-ca
  secretName: vectra-internal-ca
  duration: 8760h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef: { name: vectra-selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: vectra-internal-ca }
spec: { ca: { secretName: vectra-internal-ca } }
---
# Jerarquia de certificados (P-U1-03; NFR-U1-21, 22).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: linkerd-trust-anchor, namespace: cert-manager }
spec:
  isCA: true
  commonName: root.linkerd.cluster.local
  secretName: linkerd-trust-anchor
  duration: 8760h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: vectra-selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: linkerd-trust-anchor }
spec:
  ca: { secretName: linkerd-trust-anchor }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: linkerd-identity-issuer, namespace: linkerd }
spec:
  isCA: true
  commonName: identity.linkerd.cluster.local
  secretName: linkerd-identity-issuer
  duration: 48h
  renewBefore: 25h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: linkerd-trust-anchor, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: postgres-server, namespace: vectra-data }
spec:
  secretName: postgres-server-tls
  duration: 2160h
  renewBefore: 720h # se renueva a los 60 dias
  dnsNames: ["*.vectra-data.svc", "*.vectra-data.svc.cluster.local"]
  issuerRef: { name: vectra-internal-ca, kind: ClusterIssuer }
---
# Publica la raiz para `identity.externalCA` (trust-manager, K21).
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata: { name: linkerd-identity-trust-roots }
spec:
  sources:
    - secret: { name: linkerd-trust-anchor, key: ca.crt }
  target:
    configMap: { key: ca-bundle.crt }
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: linkerd }
---
# La CA interna para quienes verifican PostgreSQL y el borde (NFR-U1-22, `sslmode=verify-full`).
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata: { name: vectra-internal-ca }
spec:
  sources:
    - secret: { name: vectra-internal-ca, key: ca.crt }
  target:
    configMap: { key: ca.crt }
    namespaceSelector:
      matchLabels: { vectra.io/mesh: enabled }
