apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-plain-secrets
  annotations:
    policies.kyverno.io/description: Los Secrets los crea External Secrets u otro controlador declarado
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  rules:
    - name: disallow-plain-secrets
      match:
        any:
          - resources:
              kinds: [Secret]
              operations: [CREATE, UPDATE]
              namespaces: [vectra-app, vectra-edge, vectra-identity, vectra-serving, vectra-staging, vectra-data, vectra-mock, vectra-observability, vectra-restore-drill]
      validate:
        message: "Los Secrets los crea External Secrets u otro controlador declarado"
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.ownerReferences || `[]` | length(@) }}"
                operator: Equals
                value: 0
              - key: "{{ request.object.metadata.labels.\"reconcile.external-secrets.io/managed\" || '' }}"
                operator: NotEquals
                value: "true"
              - key: "{{ request.object.metadata.annotations.\"cert-manager.io/certificate-name\" || '' }}"
                operator: Equals
                value: ""
