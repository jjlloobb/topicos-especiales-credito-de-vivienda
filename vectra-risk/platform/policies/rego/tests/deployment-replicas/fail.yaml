# espera: una con menos de 2 replicas
apiVersion: apps/v1
kind: Deployment
metadata: { name: una, namespace: vectra-app }
spec:
  replicas: 1
  template:
    metadata: { labels: { app.kubernetes.io/name: una } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: una, namespace: vectra-app }
spec: { scaleTargetRef: { kind: Deployment, name: una } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: una, namespace: vectra-app }
spec: { selector: { matchLabels: { app.kubernetes.io/name: una } } }
