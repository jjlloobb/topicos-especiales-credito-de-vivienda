apiVersion: apps/v1
kind: Deployment
metadata: { name: con, namespace: vectra-app }
spec:
  replicas: 2
  template:
    metadata: { labels: { app.kubernetes.io/name: con } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: con, namespace: vectra-app }
spec: { scaleTargetRef: { kind: Deployment, name: con } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: con, namespace: vectra-app }
spec: { selector: { matchLabels: { app.kubernetes.io/name: con } } }
