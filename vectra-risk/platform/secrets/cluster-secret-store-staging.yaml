# NFR-U1-24: unica via para Secrets de aplicacion. Entorno: staging.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vectra-store }
spec:
  provider:
    vault: { server: "https://boveda.banco.internal", path: vectra, version: v2, caProvider: { type: ConfigMap, name: banco-ca, key: ca.crt, namespace: external-secrets }, auth: { kubernetes: { mountPath: kubernetes, role: vectra-eso, serviceAccountRef: { name: external-secrets, namespace: external-secrets } } } }
