# K11 solo en staging: vectra-mock no existe en prod, y el AppProject de prod lo rechazaria.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secrets
  namespace: vectra-mock
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - update
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secrets
  namespace: vectra-mock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
