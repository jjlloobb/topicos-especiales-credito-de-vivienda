# NFR-U1-24: unica via para Secrets de aplicacion. Entorno: kind.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vectra-store }
spec:
  provider:
    vault: { server: "http://vault.vault.svc:8200", path: secret, version: v2, auth: { tokenSecretRef: { name: vault-token, key: token, namespace: external-secrets } } }
