# Solo kind (issue 7, opcion A). El controlador de ESO lista y vigila los Secret de todo el cluster, y K11 no se lo da.
# Este permiso lee TODOS los Secret. No resuelve K11: staging y prod siguen sin el, con la decision abierta para cumplimiento.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-secrets-read-kind
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-secrets-read-kind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-secrets-read-kind
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
