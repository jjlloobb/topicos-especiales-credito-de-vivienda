# RBAC de ESO sin acceso global a Secrets (K11): lo del chart 2.14.0 menos `secrets`.
# Los Secret se conceden por namespace en eso-rbac-k11.yaml. Revisar al subir de version del chart.
# Sin `cert-controller`: cert-manager emite el certificado del webhook con este Issuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
spec:
  selfSigned: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
- apiGroups:
  - external-secrets.io
  resources:
  - secretstores
  - clustersecretstores
  - externalsecrets
  - clusterexternalsecrets
  - pushsecrets
  - clusterpushsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  - externalsecrets/status
  - externalsecrets/finalizers
  - secretstores
  - secretstores/status
  - secretstores/finalizers
  - clustersecretstores
  - clustersecretstores/status
  - clustersecretstores/finalizers
  - clusterexternalsecrets
  - clusterexternalsecrets/status
  - clusterexternalsecrets/finalizers
  - pushsecrets
  - pushsecrets/status
  - pushsecrets/finalizers
  - clusterpushsecrets
  - clusterpushsecrets/status
  - clusterpushsecrets/finalizers
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - generators.external-secrets.io
  resources:
  - generatorstates
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - generators.external-secrets.io
  resources:
  - acraccesstokens
  - cloudsmithaccesstokens
  - clustergenerators
  - ecrauthorizationtokens
  - fakes
  - gcraccesstokens
  - githubaccesstokens
  - gitlabdeploytokens
  - quayaccesstokens
  - passwords
  - sshkeys
  - stssessiontokens
  - uuids
  - vaultdynamicsecrets
  - webhooks
  - grafanas
  - mfas
  - beyondtrustworkloadcredentialsdynamicsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  verbs:
  - create
  - update
  - delete
- apiGroups:
  - external-secrets.io
  resources:
  - pushsecrets
  verbs:
  - create
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-servicebindings
rules:
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  - pushsecrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-controller
subjects:
- name: external-secrets
  namespace: external-secrets
  kind: ServiceAccount
