# K11: ESO materializa Secrets solo en los namespaces de Vectra que declaran ExternalSecret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secrets
  namespace: vectra-app
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - update
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secrets
  namespace: vectra-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
---
