# K11 solo en kind: vectra-mock (no existe en prod) y el token con que ESO entra a Vault dev, que no se generaliza.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-vault-token
  namespace: external-secrets
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - vault-token
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-vault-token
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-vault-token
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secrets
  namespace: vectra-mock
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - update
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secrets
  namespace: vectra-mock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
