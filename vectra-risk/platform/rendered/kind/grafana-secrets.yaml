# Secrets que kube-prometheus-stack necesita para arrancar: van en una wave anterior (componente `grafana-secrets`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: alertmanager-config, namespace: vectra-observability }
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  data:
    - { secretKey: url, remoteRef: { key: alertmanager/relay, property: url } }
  target:
    name: alertmanager-config
    template:
      data:
        # F72: el receptor por severidad, con Watchdog cada 5 min.
        alertmanager.yaml: |
          global: { resolve_timeout: 5m }
          route:
            receiver: banco
            group_by: [alertname, severity]
            routes:
              - { matchers: ['alertname="Watchdog"'], receiver: banco, repeat_interval: 5m }
              - { matchers: ['severity="SEV1"'], receiver: banco, repeat_interval: 1h }
              - { matchers: ['severity="SEV2"'], receiver: banco, repeat_interval: 4h }
              - { matchers: ['severity="SEV3"'], receiver: banco, repeat_interval: 24h }
          receivers:
            - name: banco
              webhook_configs:
                - { url: "{{ .url }}", send_resolved: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-admin, namespace: vectra-observability }
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  target: { name: grafana-admin }
  data:
    - { secretKey: admin-user, remoteRef: { key: grafana/admin, property: user } }
    - { secretKey: admin-password, remoteRef: { key: grafana/admin, property: password } }
