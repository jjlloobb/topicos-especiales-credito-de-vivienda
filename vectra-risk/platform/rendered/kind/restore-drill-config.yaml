# kind: los backups viven en MinIO (F118) y el volumen no puede pedir el tamano de produccion.
apiVersion: v1
kind: ConfigMap
metadata: { name: restore-drill-config, namespace: vectra-restore-drill }
data:
  BACKUP_DESTINATION: s3://vectra-backups
  BACKUP_ENDPOINT: http://minio.vectra-data.svc:9000
  RESTORE_STORAGE_SIZE: 2Gi
