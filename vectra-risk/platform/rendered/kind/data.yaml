# Source: vectra-data/templates/clusters.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: case-db
  namespace: vectra-data
  labels:
    vectra.io/criticality: high
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-system-trixie@sha256:8fd8db26090e602458269741849e5c9cd7aff577a22af53c8a402c580fd1e729
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 2
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: case
      owner: case_migrator
      secret: { name: pg-role-case-migrator }
  priorityClassName: vectra-critical
  postgresql:
    syncReplicaElectionConstraint:
      enabled: true
      nodeLabelsAntiAffinity: [topology.kubernetes.io/zone]
    parameters:
      max_connections: "100"
      archive_timeout: 60s
      ssl_min_protocol_version: TLSv1.2
  certificates:
    serverTLSSecret: postgres-server-tls
    serverCASecret: postgres-server-tls
  inheritedMetadata:
    annotations:
      config.linkerd.io/skip-inbound-ports: "8000"
  storage:
    size: 2Gi
    storageClass: standard
  walStorage:
    size: 1Gi
    storageClass: standard
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - { key: vectra.io/pool, operator: Equal, value: data, effect: NoSchedule }
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels: { cnpg.io/cluster: case-db }
  managed:
    roles:
      - name: case_app
        ensure: present
        login: true
        passwordSecret: { name: pg-role-case-app }
      - name: case_migrator
        ensure: present
        login: true
        passwordSecret: { name: pg-role-case-migrator }
      - name: case_retention
        ensure: present
        login: true
        passwordSecret: { name: pg-role-case-retention }
      - name: case_worker
        ensure: present
        login: true
        passwordSecret: { name: pg-role-case-worker }
  backup:
    target: prefer-standby
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://vectra-backups/case-db
      endpointURL: http://minio.vectra-data.svc:9000
      s3Credentials:
        accessKeyId: { name: postgres-backup-credentials, key: ACCESS_KEY_ID }
        secretAccessKey: { name: postgres-backup-credentials, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }

