# Metricas cnpg_* de las alertas de PostgreSQL. `cluster` es la etiqueta que usan las reglas.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: case-db
  namespace: vectra-data
spec:
  selector:
    matchLabels: { cnpg.io/cluster: case-db, cnpg.io/podRole: instance }
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster], targetLabel: cluster }

