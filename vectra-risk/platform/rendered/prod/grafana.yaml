# Permisos de carpetas: Job PostSync y CronJob de comprobacion (F110, F113; U11 BR-U11-13).
apiVersion: v1
kind: ServiceAccount
metadata: { name: grafana-folder-permissions, namespace: vectra-observability }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-folder-permissions-token, namespace: vectra-observability }
spec:
  secretStoreRef: { name: vectra-store, kind: ClusterSecretStore }
  target: { name: grafana-folder-permissions-token }
  data:
    - { secretKey: GRAFANA_TOKEN, remoteRef: { key: grafana/folder-permissions, property: token } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-folder-permissions
  namespace: vectra-observability
  labels: { app.kubernetes.io/name: grafana-folder-permissions, vectra.io/criticality: medium }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana-folder-permissions }
      annotations: { config.alpha.linkerd.io/proxy-enable-native-sidecar: "true" }
    spec:
      serviceAccountName: grafana-folder-permissions
      priorityClassName: vectra-low
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: apply
          image: registro.vectra.internal/grafana-folder-permissions@sha256:f7610a22893c9b39e29f2851aae50c90422054262321060ce3e9fe4152eec7d9
          command: [python, /app/folder_permissions.py, apply]
          env:
            - { name: FOLDER_PERMISSIONS, value: /app/folder-permissions.yaml }
            - { name: GRAFANA_URL, value: "http://kube-prometheus-stack-grafana.vectra-observability.svc:80" }
          envFrom:
            - secretRef: { name: grafana-folder-permissions-token }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-folder-check
  namespace: vectra-observability
  labels: { app.kubernetes.io/name: grafana-folder-check, vectra.io/criticality: medium }
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app.kubernetes.io/name: grafana-folder-check }
          annotations: { config.alpha.linkerd.io/proxy-enable-native-sidecar: "true" }
        spec:
          serviceAccountName: grafana-folder-permissions
          priorityClassName: vectra-low
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: check
              image: registro.vectra.internal/grafana-folder-permissions@sha256:f7610a22893c9b39e29f2851aae50c90422054262321060ce3e9fe4152eec7d9
              command: [python, /app/folder_permissions.py, check]
              env:
                - { name: FOLDER_PERMISSIONS, value: /app/folder-permissions.yaml }
                - { name: GRAFANA_URL, value: "http://kube-prometheus-stack-grafana.vectra-observability.svc:80" }
                - { name: PUSHGATEWAY_URL, value: "http://pushgateway.vectra-observability.svc:9091" }
              envFrom:
                - secretRef: { name: grafana-folder-permissions-token }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
