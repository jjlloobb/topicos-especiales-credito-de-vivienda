# Solo kind: una replica y poca memoria para un portatil de 14 GiB. Sin HA ni gossip F116.
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 3d
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
prometheusOperator:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
grafana:
  # U01-T11: kind no instala Loki ni Tempo. Las dos fuentes de datos de `kube-prometheus-stack.yaml` quedarian apuntando a Services que no existen; en kind Grafana solo lee Prometheus.
  additionalDataSources: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi } # 256Mi no basta: 250 MiB en reposo y OOMKilled al arrancar y con `grafana cli` (medido en kind, 2026-11-14)
