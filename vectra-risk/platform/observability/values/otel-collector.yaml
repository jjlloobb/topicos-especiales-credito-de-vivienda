mode: deployment
replicaCount: 2
fullnameOverride: otel-collector
serviceAccount: { create: true, name: otel-collector }
additionalLabels: { vectra.io/criticality: medium }
priorityClassName: vectra-normal
image: { repository: otel/opentelemetry-collector-contrib, tag: "0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849" }
podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
config:
  receivers:
    otlp: { protocols: { grpc: { endpoint: "0.0.0.0:4317" } } }
  exporters:
    otlp/tempo: { endpoint: "tempo-distributor.vectra-observability.svc:4317", tls: { insecure: true } }
  service:
    pipelines:
      traces: { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
