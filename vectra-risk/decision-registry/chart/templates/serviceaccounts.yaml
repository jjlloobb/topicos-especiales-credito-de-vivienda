{{- /* ServiceAccounts por identidad (P-U3-08). Linkerd necesita el token de la cuenta: automount queda activo. */ -}}
{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: decision-registry
{{- end }}
