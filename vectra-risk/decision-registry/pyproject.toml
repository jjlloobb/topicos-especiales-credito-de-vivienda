[project]
name = "vectra-decision-registry"
version = "0.1.0"
description = "U3 decision-registry: registro append-only encadenado"
requires-python = ">=3.12,<3.13"
# El cliente de Transit (firma de checkpoints) va por `vectra_common.deps.call`, sin `hvac` (NFR-U3-50).
dependencies = [
  "psycopg[binary]==3.3.8",
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "zstandard==0.25.0",
  "pyyaml==6.0.3",
  "vectra-contracts",
  "vectra-common",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_registry"]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
