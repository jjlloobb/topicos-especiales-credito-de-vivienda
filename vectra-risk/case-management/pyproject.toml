[project]
name = "vectra-case"
version = "0.1.0"
description = "U8 case-management: casos, evaluacion, evidencia en dos fases y retencion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vectra-contracts",
  "vectra-common",
  "psycopg[binary]==3.3.8",
  "alembic==1.20.1",
  "sqlalchemy==2.1.8",
]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_case"]
