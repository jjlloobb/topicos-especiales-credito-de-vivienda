{{- /* ServiceAccounts por identidad (nombres de flows.yaml): Linkerd identifica a cada proceso por la suya. `migration-case` es la del Job de migracion (F44).
El Job rt5-demo usa la de `case-service` (INF-U8-03). Automount queda activo (Linkerd necesita el token). */ -}}
{{- $accounts := list .Values.caseService.name .Values.caseWorker.name "migration-case" }}
{{- range $name := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: case-management
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
{{- if .Values.coreMock.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mock.name }}
  namespace: {{ .Values.mockNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.mock.name }}
    app.kubernetes.io/part-of: case-management
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
