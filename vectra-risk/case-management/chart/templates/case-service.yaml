{{- /* case-service (Paso 20; INF-U8-01, 04, 06; NFR-U8-10, 12, 20; F04, F10, F16, F17, F40, F50, F104). Una imagen (`case-management`) y esta orden:
`python -m vectra_case.app` (8080 y 8081). Las variables son las de `Settings.from_env` mas las de U0 (services.md, «Variables de entorno»): ninguna constante
de `config.py` (INF-U8-07). `core.enabled = false` (produccion) no trae `CASE_CORE_URL`. El pod lleva `app.kubernetes.io/name` Y `vectra.io/workload`: el Service y el PDB
seleccionan las dos, para que el pod del Job rt5-demo (solo la primera, que es la que admite la NetworkPolicy del mock) nunca reciba trafico del Service. */ -}}
{{- $svc := .Values.caseService -}}
{{- $common := .Values.common -}}
{{- $image := include "case-management.image" (list . "caseManagement" "case-management") -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: case-management
    vectra.io/criticality: {{ $common.criticality }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $common.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
      vectra.io/workload: {{ $svc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        app.kubernetes.io/part-of: case-management
        vectra.io/workload: {{ $svc.name }}
      annotations:
        # Sidecar nativo de Linkerd (P-U1-05): el proxy termina despues del contenedor de la app (INF-U8-06).
        config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
    spec:
      serviceAccountName: {{ $svc.name }}
      priorityClassName: {{ $common.priorityClassName }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "case-management.pod-security" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $svc.name }}
              vectra.io/workload: {{ $svc.name }}
      containers:
        - name: {{ $svc.name }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, vectra_case.app]
          ports:
            - { name: http, containerPort: {{ $common.port }} }
            - { name: metrics, containerPort: {{ $common.metricsPort }} }
          env:
            - { name: CASE_DB_DSN, value: {{ include "case-management.dsn" . | quote }} }
            {{- include "case-management.pg-env" .Values.database.secrets.app | nindent 12 }}
            - { name: CASE_GOVERNANCE_URL, value: {{ required "peers.governanceUrl es obligatorio" .Values.peers.governanceUrl | quote }} }
            - { name: CASE_REGISTRY_URL, value: {{ required "peers.registryUrl es obligatorio" .Values.peers.registryUrl | quote }} }
            - { name: CASE_CORE_ENABLED, value: {{ .Values.core.enabled | quote }} }
            {{- if .Values.core.enabled }}
            - { name: CASE_CORE_URL, value: {{ required "core.url es obligatorio con core.enabled" .Values.core.url | quote }} }
            {{- end }}
            - { name: CASE_ALLOW_TEST_SCENARIOS, value: {{ .Values.allowTestScenarios | quote }} }
            # Variables de U0 (F50): validan los tokens de entrada (`VECTRA_OIDC_ISSUER`, `VECTRA_JWKS_URL`) y piden los de servicio.
            - { name: VECTRA_OIDC_ISSUER, value: {{ required "keycloak.issuer es obligatorio" .Values.keycloak.issuer | quote }} }
            - { name: VECTRA_JWKS_URL, value: {{ required "keycloak.jwksUrl es obligatorio" .Values.keycloak.jwksUrl | quote }} }
            {{- include "case-management.identity-env" (list . $svc) | nindent 12 }}
          # Sin `startupProbe` (INF-U8-04). La liveness es `/healthz`: INF-U8-04 la llama `/livez`, pero `vectra_common.ops_server` (U0) sirve `/metrics`, `/healthz` y `/readyz`.
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          # INF-U8-06: deja que Linkerd y los Endpoints dejen de enviar trafico antes del SIGTERM (accion `sleep` nativa, sin binario en la imagen).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $svc.preStopSeconds }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: service-identity, mountPath: {{ .Values.identity.mountPath | quote }}, readOnly: true }
            {{- include "case-management.ca-mount" . | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        # 0444: el contenedor corre como 65532 y el archivo del Secret es de root; el volumen es de solo lectura y solo de este pod.
        - name: service-identity
          secret: { secretName: {{ printf "%s-client" $svc.name | quote }}, defaultMode: 292 }
        {{- include "case-management.ca-volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: case-management
spec:
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
    vectra.io/workload: {{ $svc.name }}
  ports:
    - { name: http, port: {{ $common.port }}, targetPort: http }
    - { name: metrics, port: {{ $common.metricsPort }}, targetPort: metrics }
{{- include "case-management.hpa-pdb" (list . $svc) }}
