[project]
name = "core-banking-mock"
version = "0.1.0"
description = "U8 core-banking-mock: core bancario simulado de solo lectura (kind y staging)"
requires-python = ">=3.12,<3.13"
# `vectra-common` ya trae FastAPI.
dependencies = ["vectra-common"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_banking_mock"]
