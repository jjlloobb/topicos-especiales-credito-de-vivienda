[pytest]
# Sin este archivo, `--cov` sin argumento mide la cobertura de U0 (`[tool.coverage.run]` de la raiz).
addopts = --cov-config=case-management/coveragerc --import-mode=importlib
pythonpath = tests/migrations tests/doubles
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: pruebas con Testcontainers (PostgreSQL real, sin cluster)
