[pytest]
# `--import-mode=importlib` y sin `__init__.py` en `tests/`, como el resto del workspace. Sin microfono, sin red y sin GitHub: grabador, transcriptor y `gh` son dobles.
addopts = --import-mode=importlib
pythonpath = tests/doubles
markers =
    manual: transcripcion real con faster-whisper; solo corre con VECTRA_NOTA_DE_VOZ_MANUAL=1 (ver README)
