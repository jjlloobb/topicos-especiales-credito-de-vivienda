{{- /* `kserve-model` (sa de F19, F22, F30 y F46 en flows.yaml) en vectra-serving y vectra-staging, con la credencial de solo lectura del
model-store (`minio-kserve`, usuario `kserve-readonly`; F46, NFR-U6-31). El Secret lo crea U1; este chart no declara Secret ni ExternalSecret. */ -}}
{{- range $ns := list .Values.namespaces.serving .Values.namespaces.staging }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.serviceAccountName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $.Values.serviceAccountName }}
    app.kubernetes.io/part-of: vectra-risk
secrets:
  - name: {{ $.Values.credentialSecret }}
{{- end }}
