[project]
name = "vectra-model-serving"
version = "0.1.0"
description = "U6 model-serving: imagenes del predictor y del explicador de cada version del modelo"
requires-python = ">=3.12,<3.13"
# NFR-U6-01: ni `shap` ni `scikit-learn` (los cubre el contrato de `.importlinter`).
# `envelope.confidence` de U5 (NFR-U5-32: solo numpy) se importa de `vectra_reference`, pero NO se declara como dependencia:
# `vectra-reference` trae `shap` y `scikit-learn` (U5 los necesita para entrenar y validar). El workspace la instala editable
# (grupo dev de la raiz) y las imagenes copian solo `vectra_reference/__init__.py` y `envelope/` (ver `predictor/Dockerfile`).
dependencies = [
  "vectra-contracts",
  "vectra-common",
  "xgboost==3.4.1",
  "numpy==2.5.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "common/src/vectra_serving_common",
  "predictor/src/vectra_predictor",
  "explainer/src/vectra_explainer",
]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
