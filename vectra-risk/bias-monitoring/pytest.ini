[pytest]
# Sin la cobertura propia, `--cov` sin argumento mide la cobertura de U0 (`[tool.coverage.run]` de la raiz).
addopts = --cov-config=bias-monitoring/coveragerc --import-mode=importlib
pythonpath = tests/doubles ../contracts/tests
markers =
    simulation: simulacion estadistica de la libreria (NFR-U9-53); tarda
