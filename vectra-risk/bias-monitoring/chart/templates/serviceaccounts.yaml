{{- /* ServiceAccounts por identidad (nombres de flows.yaml): Linkerd identifica a cada proceso por la suya. */ -}}
{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: bias-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
