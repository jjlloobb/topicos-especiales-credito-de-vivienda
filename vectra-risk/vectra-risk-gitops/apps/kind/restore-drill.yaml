apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restore-drill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: vectra-kind
  source:
    repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    path: vectra-risk/platform/restore-drill
    directory:
      include: '{cronjob.yaml,configmap-kind.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-restore-drill
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
