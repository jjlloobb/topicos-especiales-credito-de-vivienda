apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-kind
  sources:
  - repoURL: https://charts.jetstack.io
    chart: trust-manager
    targetRevision: v0.26.0
    helm:
      valueFiles:
      - $values/vectra-risk/platform/mesh/trust-manager-values.yaml
  - repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
