apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: vectra-kind
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      valueFiles:
      - $values/vectra-risk/platform/observability/values/kube-prometheus-stack.yaml
      - $values/vectra-risk/platform/observability/values/kube-prometheus-stack-kind.yaml
  - repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
