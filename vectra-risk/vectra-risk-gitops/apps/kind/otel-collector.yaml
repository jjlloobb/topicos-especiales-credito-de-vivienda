apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: vectra-kind
  sources:
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.178.1
    helm:
      valueFiles:
      - $values/vectra-risk/platform/observability/values/otel-collector.yaml
      - $values/vectra-risk/platform/observability/values/otel-collector-kind.yaml
  - repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
