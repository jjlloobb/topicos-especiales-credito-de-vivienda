apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: vectra-kind
  source:
    repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    path: vectra-risk/platform/data/chart
    helm:
      valueFiles:
      - /vectra-risk/vectra-risk-gitops/envs/kind/values.yaml
      - /vectra-risk/platform/data/chart/values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-data
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
