apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vectra-kind
  namespace: argocd
spec:
  description: Vectra Risk, entorno kind
  sourceRepos:
  - docker.io/envoyproxy
  - ghcr.io/kserve/charts
  - https://argoproj.github.io/argo-helm
  - https://charts.external-secrets.io
  - https://charts.jetstack.io
  - https://charts.min.io
  - https://cloudnative-pg.github.io/charts
  - https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
  - https://grafana.github.io/helm-charts
  - https://helm.linkerd.io/edge
  - https://helm.releases.hashicorp.com
  - https://kyverno.github.io/kyverno
  - https://open-telemetry.github.io/opentelemetry-helm-charts
  - https://prometheus-community.github.io/helm-charts
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  - server: https://kubernetes.default.svc
    namespace: cert-manager
  - server: https://kubernetes.default.svc
    namespace: cnpg-system
  - server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  - server: https://kubernetes.default.svc
    namespace: external-secrets
  - server: https://kubernetes.default.svc
    namespace: kserve
  - server: https://kubernetes.default.svc
    namespace: kyverno
  - server: https://kubernetes.default.svc
    namespace: linkerd
  - server: https://kubernetes.default.svc
    namespace: linkerd-cni
  - server: https://kubernetes.default.svc
    namespace: vault
  - server: https://kubernetes.default.svc
    namespace: vectra-app
  - server: https://kubernetes.default.svc
    namespace: vectra-data
  - server: https://kubernetes.default.svc
    namespace: vectra-edge
  - server: https://kubernetes.default.svc
    namespace: vectra-identity
  - server: https://kubernetes.default.svc
    namespace: vectra-mock
  - server: https://kubernetes.default.svc
    namespace: vectra-observability
  - server: https://kubernetes.default.svc
    namespace: vectra-restore-drill
  - server: https://kubernetes.default.svc
    namespace: vectra-serving
  - server: https://kubernetes.default.svc
    namespace: vectra-staging
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: apiregistration.k8s.io
    kind: APIService
  - group: scheduling.k8s.io
    kind: PriorityClass
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: kyverno.io
    kind: ClusterPolicy
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: cert-manager.io
    kind: ClusterIssuer
  - group: trust.cert-manager.io
    kind: Bundle
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: gateway.networking.k8s.io
    kind: GatewayClass
  - group: serving.kserve.io
    kind: ClusterServingRuntime
  - group: serving.kserve.io
    kind: ClusterStorageContainer
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
    name: safe-upgrades.gateway.networking.k8s.io
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
    name: safe-upgrades.gateway.networking.k8s.io
