apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: vectra-kind
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 3.10.1
    helm:
      valueFiles:
      - $values/vectra-risk/platform/observability/values/pushgateway.yaml
  - repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
