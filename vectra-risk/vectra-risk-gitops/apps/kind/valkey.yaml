apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: vectra-kind
  source:
    repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    path: vectra-risk/identity-edge/charts/valkey/rendered/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-edge
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
