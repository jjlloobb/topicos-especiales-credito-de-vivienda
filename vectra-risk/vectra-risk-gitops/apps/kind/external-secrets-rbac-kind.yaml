apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-rbac-kind
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-kind
  source:
    repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    path: vectra-risk/platform/secrets
    directory:
      include: eso-rbac-secrets-read-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
