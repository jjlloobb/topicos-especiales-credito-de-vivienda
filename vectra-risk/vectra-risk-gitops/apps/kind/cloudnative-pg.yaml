apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-kind
  sources:
  - repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      valueFiles:
      - $values/vectra-risk/platform/operators/cloudnative-pg.yaml
      - $values/vectra-risk/platform/operators/cloudnative-pg-kind.yaml
  - repoURL: https://github.com/jjlloobb/topicos-especiales-credito-de-vivienda.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
