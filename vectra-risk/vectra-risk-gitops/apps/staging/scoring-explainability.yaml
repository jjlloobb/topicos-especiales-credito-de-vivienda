apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoring-explainability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: vectra-staging
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/scoring-explainability/chart
    helm:
      valueFiles:
      - /vectra-risk/vectra-risk-gitops/envs/staging/values.yaml
      - /vectra-risk/vectra-risk-gitops/values/staging/scoring-explainability.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-app
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
