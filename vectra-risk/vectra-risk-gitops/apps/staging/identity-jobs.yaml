apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-jobs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: vectra-staging
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/identity-edge/jobs/rendered/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-identity
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
