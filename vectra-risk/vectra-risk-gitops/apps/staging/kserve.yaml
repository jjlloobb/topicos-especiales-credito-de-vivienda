apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-staging
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: kserve-resources
    targetRevision: v0.21.0
    helm:
      valueFiles:
      - $values/vectra-risk/platform/operators/kserve.yaml
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
