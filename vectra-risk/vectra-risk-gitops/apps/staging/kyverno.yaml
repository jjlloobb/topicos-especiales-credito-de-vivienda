apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-staging
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valueFiles:
      - $values/vectra-risk/platform/operators/kyverno.yaml
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
