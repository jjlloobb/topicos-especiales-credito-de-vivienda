apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: console-bff
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: vectra-staging
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/console/chart/bff
    helm:
      valueFiles:
      - /vectra-risk/vectra-risk-gitops/envs/staging/values.yaml
      - /vectra-risk/vectra-risk-gitops/values/staging/console-bff.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-app
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
