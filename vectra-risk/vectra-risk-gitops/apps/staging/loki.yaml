apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: vectra-staging
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: loki
    targetRevision: 7.5.0
    helm:
      valueFiles:
      - $values/vectra-risk/platform/observability/values/loki.yaml
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
