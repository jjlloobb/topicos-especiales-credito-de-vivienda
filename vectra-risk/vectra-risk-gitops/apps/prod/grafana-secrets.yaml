apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: vectra-prod
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/platform/observability/grafana
    directory:
      include: external-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
