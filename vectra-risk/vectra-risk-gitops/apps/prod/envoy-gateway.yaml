apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-prod
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: gateway-helm
    targetRevision: v1.9.3
    helm:
      valueFiles:
      - $values/vectra-risk/platform/operators/envoy-gateway.yaml
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
