apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-prod
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/platform/secrets
    directory:
      include: eso-rbac-cluster.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
