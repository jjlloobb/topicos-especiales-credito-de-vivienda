apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-prod
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: kserve-crd
    targetRevision: v0.21.0
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
