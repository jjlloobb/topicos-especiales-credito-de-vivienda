apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-serving
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  project: vectra-prod
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/model-serving/chart
    helm:
      valueFiles:
      - /vectra-risk/vectra-risk-gitops/envs/prod/values.yaml
      - /vectra-risk/vectra-risk-gitops/values/prod/model-serving.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-serving
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
