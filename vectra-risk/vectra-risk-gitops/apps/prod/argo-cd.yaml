apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: vectra-prod
  sources:
  - repoURL: https://charts.banco.internal/vectra
    chart: argo-cd
    targetRevision: 10.11.6
    helm:
      valueFiles:
      - $values/vectra-risk/platform/operators/argo-cd.yaml
  - repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
