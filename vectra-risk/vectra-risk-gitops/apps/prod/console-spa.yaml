apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: console-spa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: vectra-prod
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/console/chart/spa
    helm:
      valueFiles:
      - /vectra-risk/vectra-risk-gitops/envs/prod/values.yaml
      - /vectra-risk/vectra-risk-gitops/values/prod/console-spa.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-edge
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
