apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: vectra-prod
  source:
    repoURL: https://git.banco.internal/vectra/vectra-risk.git
    targetRevision: main
    path: vectra-risk/identity-edge/charts/valkey/rendered/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: vectra-edge
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
