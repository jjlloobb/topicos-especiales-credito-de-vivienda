# El inventario unico de lo que solo se puede comprobar en kind (U12-T06, Paso 18). La guia `docs/paso-18-kind.md`, las plantillas de
# `aidlc-docs/construction/system-verification/evidence/kind/` y la tabla de `evidence/cierre-demo.md` salen de aqui y las ata
# `tests/unit/test_kind_inventory.py`.
#
# `fuentes`: `<abreviatura>:<linea>` o `<abreviatura>:<desde>-<hasta>`; la abreviatura es una clave de `abreviaturas` o una ruta desde `vectra-risk/`.
# `comprobacion`: al menos un elemento que no sea `manual`. Tipos: `guion:<nombre>` (un guion de `docs/kind/`), `seccion:<s>` (una de las 8 secciones
# de la CLI), `verify:<nombre>` (`demos/verify/`), `lectura:<orden>` (solo `kubectl get`, `logs`, `auth can-i`, `port-forward`, `free`, `docker stats`,
# `git log`, `grep`, `ls`, `date`, `make -C case-management policy-chart`) y `manual:<texto>` (lo que se mira a mano, ademas de lo anterior).
# `demo`: lista con `Base` (flujo base, que sostiene las cuatro), `D1` a `D4`; vacia = ninguna demo depende de ella.
# Los numeros de linea son los de la rama `tarea/U12-T06`; `test_kind_inventory.py` comprueba que cada uno cae dentro del archivo.

