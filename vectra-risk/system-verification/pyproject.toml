[project]
name = "vectra-verification"
version = "0.1.0"
description = "U12 system-verification: verificacion del sistema (simulador, conductor, escenarios, informe), fuera del cluster y de solo lectura"
requires-python = ">=3.12,<3.13"
# Sin la libreria comun de la API (Paso 1 del plan: la imagen no la lleva; tech-stack: `httpx` propio). `playwright` lo agrega U12-T02.
dependencies = ["vectra-contracts", "httpx==0.28.1", "pyotp==2.10.0", "pyyaml==6.0.3"]

[tool.uv.sources]
vectra-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_verification"]
