[pytest]
# Sin la cobertura propia, `--cov` sin argumento mide la cobertura de U0 (`[tool.coverage.run]` de la raiz).
# `--import-mode=importlib` y sin `__init__.py` en `tests/`: paquetes de prueba sin colision entre unidades (CANDIDATAS.md).
addopts = --cov-config=system-verification/coveragerc --import-mode=importlib
pythonpath = tests/doubles
markers =
    integration: pruebas con Testcontainers (Keycloak y PostgreSQL reales) y apps reales en proceso; sin cluster
