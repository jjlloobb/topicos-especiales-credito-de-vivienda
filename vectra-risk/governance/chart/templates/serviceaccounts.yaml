{{- /* ServiceAccounts por identidad (nombres de flows.yaml). `governance-service` necesita el token de la cuenta (K01 y Linkerd): automount activo. */ -}}
{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: governance
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
