{{- /* ServiceMonitor del puerto de metricas del servicio (F60; 8081). */ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: governance-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: governance-service
    app.kubernetes.io/part-of: governance
    vectra.io/criticality: {{ .Values.service.criticality }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: governance-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # La etiqueta `service` que emite U0 no pasa a `exported_service` (shared-infrastructure.md §1).
      honorLabels: true
