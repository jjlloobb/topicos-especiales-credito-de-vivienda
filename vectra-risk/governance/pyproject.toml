[project]
name = "vectra-governance"
version = "0.1.0"
description = "U4 governance: modelos, politicas, fuentes de datos y serving-config"
requires-python = ">=3.12,<3.13"
# NFR-U4-24: el servicio NO lleva librerias de inferencia (onnxruntime, xgboost, lightgbm); solo el extra `validation` del Job las trae.
dependencies = [
  "psycopg[binary]==3.3.8",
  "httpx==0.28.1",
  "alembic==1.20.1",
  "vectra-contracts",
  "vectra-common",
]

[project.optional-dependencies]
# Imagen del `validation_job` (Paso 13): AUC, sincronia predictor/explicador y disparidad inicial. `vectra-disparity` es la
# libreria real de U9 (`bias-monitoring/disparity/`, solo biblioteca estandar); `pyarrow` lee el Parquet del dataset (F31).
validation = [
  "onnxruntime==1.31.1",
  "xgboost==3.4.1",
  "lightgbm==4.7.0",
  "numpy==2.5.4",
  "pyarrow==26.0.1",
  "vectra-disparity",
]

[project.scripts]
promotion-tool = "vectra_promotion.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_governance", "validation_job/vectra_validation", "promotion_tool/vectra_promotion"]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
vectra-disparity = { workspace = true }
