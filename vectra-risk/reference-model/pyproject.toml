[project]
name = "vectra-reference"
version = "0.1.0"
description = "U5 reference-model: generador sintetico, modelo de referencia y conjunto adversarial (herramienta offline)"
requires-python = ">=3.12,<3.13"
# `shap` y `scikit-learn` entran ya en el Paso 1 (U05-T01) aunque su uso llegue despues: lo pide el plan de U5.
# `envelope/confidence.py` NO usa ninguna de estas salvo numpy (NFR-U5-32).
dependencies = [
  "vectra-contracts",
  "vectra-disparity",
  "pyyaml==6.0.3",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "pyarrow==26.0.1",
  "xgboost==3.4.1",
  "shap==0.54.1",
  "scikit-learn==1.9.1",
]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-disparity = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_reference"]
