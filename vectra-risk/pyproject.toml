[project]
name = "vectra-risk"
version = "0.1.0"
description = "Workspace de Vectra Risk"
requires-python = ">=3.12,<3.13"
dependencies = ["vectra-contracts", "vectra-common", "vectra-decision-registry"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts/python/vectra_contracts", "contracts/python/vectra_common", "identity-edge", "decision-registry"]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
vectra-decision-registry = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "pytest-benchmark==5.3.0",
  "hypothesis==6.170.14",
  "mutmut==3.8.1",
  "import-linter==2.15",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pyyaml==6.0.3",
  "types-pyyaml",
  "testcontainers==4.14.2",
  # U02-T14 (H4): pruebas e2e de U2. Los navegadores (`playwright install`) se instalan solo en el Paso 16.
  "playwright==1.64.0",
  "pytest-playwright==0.10.0",
  "pyotp==2.10.0",
  "axe-playwright-python==0.1.8",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["contracts/tests"]
pythonpath = ["contracts", "contracts/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "common: propiedades de la capa de API (vectra_common)",
  "logic: pruebas de ejemplo de la logica de negocio",
  "api: pruebas de ejemplo de la capa de API",
  "benchmark: benchmarks con umbral (NFR-U0-01..03)",
  "integration: pruebas con Testcontainers (PostgreSQL real, sin cluster)",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["contracts/python/vectra_contracts/src", "contracts/python/vectra_common/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "T20"]
# La longitud la gestiona `ruff format`; las marcas `pragma: no mutate` no se parten.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"platform/**" = ["T201", "S603", "S607", "S107"]
"vectra-risk-gitops/**" = ["T201"]
"decision-registry/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"decision-registry/migrations/**" = ["S608"]
"contracts/tests/**" = ["S", "B", "E501", "BLE", "T20", "I001"]
"contracts/tools/**" = ["T20", "S603", "S607", "E501"]
"contracts/python/vectra_contracts/src/vectra_contracts/routes/__init__.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["vectra_contracts", "vectra_common"]
