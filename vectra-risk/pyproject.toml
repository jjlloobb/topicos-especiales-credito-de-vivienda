[project]
name = "vectra-risk"
version = "0.1.0"
description = "Workspace de Vectra Risk"
requires-python = ">=3.12,<3.13"
dependencies = ["vectra-contracts", "vectra-common", "vectra-decision-registry", "vectra-governance"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts/python/vectra_contracts", "contracts/python/vectra_common", "identity-edge", "decision-registry", "reference-model", "governance", "bias-monitoring", "bias-monitoring/disparity", "model-serving", "scoring-explainability/scoring", "scoring-explainability/explainability", "case-management", "case-management/core_banking_mock", "product-metrics"]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
vectra-decision-registry = { workspace = true }
vectra-governance = { workspace = true }
vectra-reference = { workspace = true }
vectra-bias = { workspace = true }
vectra-disparity = { workspace = true }
vectra-model-serving = { workspace = true }
vectra-scoring = { workspace = true }
vectra-explainability = { workspace = true }
vectra-case = { workspace = true }
core-banking-mock = { workspace = true }
vectra-product = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "pytest-benchmark==5.3.0",
  "hypothesis==6.170.14",
  "mutmut==3.8.1",
  "import-linter==2.15",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pyyaml==6.0.3",
  "types-pyyaml",
  "testcontainers==4.14.2",
  # U02-T14 (H4): pruebas e2e de U2. Los navegadores (`playwright install`) se instalan solo en el Paso 16.
  "playwright==1.64.0",
  "pytest-playwright==0.10.0",
  "pyotp==2.10.0",
  "axe-playwright-python==0.1.8",
  "httpx==0.28.1",
  # U05-T01: U5 (reference-model) se instala editable en el entorno del workspace para que `uv run` lo importe.
  "vectra-reference",
  # U09-T01: U9 (bias-monitoring) y su libreria se instalan editables. Fairlearn, pandas y numpy solo sirven a las
  # pruebas y a la simulacion de U9 (oraculo PBT-U9-01); scipy y scikit-learn llegan como transitivas de Fairlearn.
  "vectra-bias",
  "vectra-disparity",
  "fairlearn==0.15.0",
  "pandas==3.1.1",
  "numpy==2.5.4",
  # U04-T05: el Job de validacion (extra `validation`) y su fixture ONNX; `onnx` solo construye el modelo de prueba.
  "vectra-governance[validation]",
  "onnx==1.22.0",
  # U06-T01: U6 (model-serving) se instala editable para que `uv run` importe sus paquetes.
  "vectra-model-serving",
  # U07-T01: U7 (scoring-explainability): dos miembros, instalados editables.
  "vectra-scoring",
  "vectra-explainability",
  # U08-T01: U8 (case-management): dos miembros, instalados editables.
  "vectra-case",
  "core-banking-mock",
  # U11-T01: U11 (product-metrics) se instala editable para que `uv run` importe `vectra_product`.
  "vectra-product",
]

[tool.pytest.ini_options]
testpaths = ["contracts/tests"]
pythonpath = ["contracts", "contracts/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "common: propiedades de la capa de API (vectra_common)",
  "logic: pruebas de ejemplo de la logica de negocio",
  "api: pruebas de ejemplo de la capa de API",
  "benchmark: benchmarks con umbral (NFR-U0-01..03)",
  "integration: pruebas con Testcontainers (PostgreSQL real, sin cluster)",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["contracts/python/vectra_contracts/src", "contracts/python/vectra_common/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*", "pyarrow.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "T20"]
# La longitud la gestiona `ruff format`; las marcas `pragma: no mutate` no se parten.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"platform/**" = ["T201", "S603", "S607", "S107"]
"vectra-risk-gitops/**" = ["T201"]
"decision-registry/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"bias-monitoring/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"decision-registry/migrations/**" = ["S608"]
"governance/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"governance/migrations/**" = ["S608"]
"model-serving/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"scoring-explainability/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"case-management/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"product-metrics/tests/**" = ["S", "B", "BLE", "T20", "I001"]
"case-management/migrations/**" = ["S608"]
"contracts/tests/**" = ["S", "B", "E501", "BLE", "T20", "I001"]
"contracts/tools/**" = ["T20", "S603", "S607", "E501"]
"contracts/python/vectra_contracts/src/vectra_contracts/routes/__init__.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["vectra_contracts", "vectra_common"]
