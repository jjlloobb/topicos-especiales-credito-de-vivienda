[project]
name = "vectra-explainability"
version = "0.1.0"
description = "U7 explainability-service: explicacion, narrativa y factualidad (miembro 2 de 2 de scoring-explainability)"
requires-python = ">=3.12,<3.13"
dependencies = ["vectra-contracts", "vectra-common"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explainability"]

[tool.uv.sources]
vectra-contracts = { workspace = true }
vectra-common = { workspace = true }
