{{- /* ServiceAccounts por identidad (nombres de flows.yaml): Linkerd identifica a cada servicio por la suya. Automount queda activo (Linkerd necesita el token). */ -}}
{{- range $key, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: scoring-explainability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
