{{- /* Un ExternalSecret por servicio (INF-U7-04; formato de governance/chart/templates/service-identity.yaml): ESO materializa en vectra-app la llave
`private_key_jwt` del cliente de U2 (`identity/clients/<clientId>`, propiedad `private-key`). El Deployment la monta de solo lectura. */ -}}
{{- range $key, $svc := .Values.services }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-client" $svc.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: scoring-explainability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $.Values.identity.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.identity.secretStore.name }}
    kind: {{ $.Values.identity.secretStore.kind }}
  target:
    name: {{ printf "%s-client" $svc.name }}
  data:
    - secretKey: private-key
      remoteRef:
        key: {{ printf "identity/clients/%s" $svc.clientId }}
        property: {{ $.Values.identity.vaultProperty }}
{{- end }}
